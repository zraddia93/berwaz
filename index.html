        /* Custom Arabic Font */
        @font-face {
            font-family: 'HT Moshreq Pro';
            src: url('HTMoshreqPro-Regular.otf') format('opentype');

            font-style: normal;

            font-family: 'HT Moshreq Pro';
            src: url('HTMoshreqPro-Bold.otf') format('opentype');
            font-weight: 700;
            font-style: normal;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #000000;
            --bg-secondary: #0a0a0a;
            --bg-tertiary: #111111;
            --bg-elevated: #161616;
            --text-primary: #ffd900;
            --text-secondary: #cca800;
            --text-tertiary: #997e00;
            --accent: #ffd900;
            --accent-dim: rgba(255,217,0,0.1);
            --border: rgba(255,217,0,0.12);
            --border-hover: rgba(255,217,0,0.25);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }

        /* Improve touch scrolling on mobile */
        * {
            -webkit-tap-highlight-color: transparent;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--text-tertiary); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-secondary); }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .fade-in { animation: fadeIn 0.5s ease-out; }
        .slide-up { animation: slideUp 0.6s ease-out; }
        .scale-in { animation: scaleIn 0.3s ease-out; }

        /* Typography */
        .font-arabic { font-family: 'HT Moshreq Pro', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .text-xs { font-size: 11px; letter-spacing: 0.05em; }
        .text-sm { font-size: 13px; }
        .text-base { font-size: 15px; }
        .text-lg { font-size: 18px; }
        .text-xl { font-size: 24px; }
        .text-2xl { font-size: 32px; }
        .text-3xl { font-size: 48px; }
        .uppercase { text-transform: uppercase; }
        .tracking-wide { letter-spacing: 0.1em; }
        .tracking-wider { letter-spacing: 0.2em; }

        /* Utility Classes */
        .flex { display: flex; }
        .items-center { align-items: center; }
        .justify-between { justify-content: space-between; }
        .justify-center { justify-content: center; }
        .gap-1 { gap: 4px; }
        .gap-2 { gap: 8px; }
        .gap-3 { gap: 12px; }
        .gap-4 { gap: 16px; }
        .gap-6 { gap: 24px; }

        /* Shimmer Loading */
        .shimmer {
            background: linear-gradient(90deg, var(--bg-tertiary) 0%, var(--bg-elevated) 50%, var(--bg-tertiary) 100%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            pointer-events: none;

<body>
    <!-- Password Gate -->

                document.getElementById('root').style.display = '';
            }
            document.getElementById('password-form').addEventListener('submit', function(e) {
                e.preventDefault();
                if (document.getElementById('password-input').value === 'berwaz93') {
                    sessionStorage.setItem('berwaz_auth', 'true');
                    document.getElementById('password-gate').style.display = 'none';
                    document.getElementById('root').style.display = '';
                } else {
                    document.getElementById('password-error').style.display = 'block';
                    document.getElementById('password-input').value = '';

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback, useRef } = React;

        /*

         * 1. Place your images/GIFs in the "content/" folder

         *

         * {
         *     "id": "1",                   // Unique identifier
         *     "title": "Frame Title",       // Display title
         *     "source": "Movie Name",       // Source film/show
         *     "year": 2024,                 // Year
         *     "director": "Director Name",  // Director
         *     "dp": "DP Name",              // Cinematographer
         *     "tags": ["tag1", "tag2"],     // Searchable tags
         *     "mood": "Mood",               // e.g., "Mysterious", "Epic"
         *     "lighting": "Lighting Type",  // e.g., "Natural", "Neon"
         *     "color": ["#hex1", "#hex2"],  // Color palette (3-4 colors)
         *     "aspect": "2.39:1",           // Aspect ratio

        // How many frames to render per page (1920 animated GIFs at once melts mobile Safari)

        // Encode each path segment separately: encodeURI() leaves "#" intact, which

        const encodePath = (p) => String(p).split('/').map(encodeURIComponent).join('/');

        const Icons = {

            ),
            Link: () => (
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>
            ),
            Image: () => (
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
            ),

                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2"><path d="m5 12 5 5L20 7"/></svg>
            )
        };

        // Directors list
        const DIRECTORS = [
            { name: "Abdullah Algallaf", nameAr: "عبدالله القلاف" },
            { name: "Abdullah Alkhamees", nameAr: "عبدالله الخميس" },
            { name: "Abdullah Majed", nameAr: "عبدالله ماجد" },
            { name: "Abdulrahman Elsingergy", nameAr: "عبدالرحمن السنجري" },
            { name: "Ali Alkalthami", nameAr: "علي الكلثمي" },
            { name: "Bader Nour", nameAr: "بدر نور" },
            { name: "Fahad Alammari", nameAr: "فهد العماري" },
            { name: "Faisal Alobrah", nameAr: "فيصل العبره" },
            { name: "Majed Aleissa", nameAr: "ماجد العيسى" },
            { name: "Malek Alhammami", nameAr: "مالك الحمامي" },
            { name: "Meshal Aljasser", nameAr: "مشعل الجاسر" },
            { name: "Mishary Almazyad", nameAr: "مشاري المزيد" },
            { name: "Mohammad Alhamdan", nameAr: "محمد الحمدان" },
            { name: "Mohammad Alharthi", nameAr: "محمد الحارثي" },
            { name: "Mohammad Almulla", nameAr: "محمد الملا" },
            { name: "Mohammad Alsuliman", nameAr: "محمد السليمان" }
        ];

        // Size Slider Component - Segmented Control Style
        const SizeSlider = ({ size, setSize }) => {
            const sizes = ['S', 'M', 'L'];

            return (
                <div style={{
                    display: 'flex',
                    alignItems: 'center',
                    background: 'var(--bg-tertiary)',

        // ═══════════════════════════════════════════════════════════════
        // BOARDS (moodboards) — saved in this browser, shareable by link.
        // Data shape is deliberately backend-ready: { id, name, frames: [id], createdAt, updatedAt }
        // ═══════════════════════════════════════════════════════════════
        const BOARDS_KEY = 'berwaz_boards_v1';
        const uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);

        const loadBoards = () => {
            try {
                const raw = localStorage.getItem(BOARDS_KEY);
                const arr = raw ? JSON.parse(raw) : [];
                return Array.isArray(arr) ? arr.filter(b => b && b.id && Array.isArray(b.frames)) : [];
            } catch { return []; }
        };
        const persistBoards = (boards) => {
            try { localStorage.setItem(BOARDS_KEY, JSON.stringify(boards)); } catch {}
        };

        const useBoards = () => {
            const [boards, setBoards] = useState(loadBoards);
            const [lastBoardId, setLastBoardId] = useState(() => { try { return localStorage.getItem(BOARDS_KEY + '_last') || null; } catch { return null; } });

            useEffect(() => { persistBoards(boards); }, [boards]);
            useEffect(() => { try { lastBoardId ? localStorage.setItem(BOARDS_KEY + '_last', lastBoardId) : localStorage.removeItem(BOARDS_KEY + '_last'); } catch {} }, [lastBoardId]);

            // Keep tabs in sync
            useEffect(() => {
                const onStorage = (e) => { if (e.key === BOARDS_KEY) setBoards(loadBoards()); };
                window.addEventListener('storage', onStorage);
                return () => window.removeEventListener('storage', onStorage);
            }, []);

            const createBoard = useCallback((name, frames = []) => {
                const b = { id: uid(), name: (name || 'Untitled board').trim().slice(0, 60), frames: [...new Set(frames)], createdAt: Date.now(), updatedAt: Date.now() };
                setBoards(prev => [b, ...prev]);
                setLastBoardId(b.id);
                return b;
            }, []);
            const renameBoard = useCallback((id, name) => {
                setBoards(prev => prev.map(b => b.id === id ? { ...b, name: (name || b.name).trim().slice(0, 60), updatedAt: Date.now() } : b));
            }, []);
            const deleteBoard = useCallback((id) => {
                setBoards(prev => prev.filter(b => b.id !== id));
                setLastBoardId(prev => prev === id ? null : prev);
            }, []);
            const toggleFrame = useCallback((boardId, frameId) => {
                let added = false;
                setBoards(prev => prev.map(b => {
                    if (b.id !== boardId) return b;
                    const has = b.frames.includes(frameId);
                    added = !has;
                    return { ...b, frames: has ? b.frames.filter(x => x !== frameId) : [...b.frames, frameId], updatedAt: Date.now() };
                }));
                setLastBoardId(boardId);
                return added;
            }, []);
            const removeFrame = useCallback((boardId, frameId) => {
                setBoards(prev => prev.map(b => b.id === boardId ? { ...b, frames: b.frames.filter(x => x !== frameId), updatedAt: Date.now() } : b));
            }, []);
            const moveFrame = useCallback((boardId, from, to) => {
                setBoards(prev => prev.map(b => {
                    if (b.id !== boardId) return b;
                    const arr = [...b.frames]; const [x] = arr.splice(from, 1); arr.splice(to, 0, x);
                    return { ...b, frames: arr, updatedAt: Date.now() };
                }));
            }, []);

            const savedIn = useCallback((frameId) => boards.filter(b => b.frames.includes(frameId)).map(b => b.id), [boards]);
            const totalSaved = useMemo(() => new Set(boards.flatMap(b => b.frames)).size, [boards]);

            return { boards, lastBoardId, createBoard, renameBoard, deleteBoard, toggleFrame, removeFrame, moveFrame, savedIn, totalSaved };
        };

        // Share links: ?board=<base64url of "name|id,id,id">  — compact, no backend needed
        const encodeBoardLink = (board) => {
            const payload = `${board.name}|${board.frames.join(',')}`;
            const b64 = btoa(unescape(encodeURIComponent(payload))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
            const u = new URL(window.location.href);
            u.search = ''; u.hash = '';
            u.searchParams.set('board', b64);
            return u.toString();
        };
        const decodeBoardLink = (param) => {
            try {
                const b64 = param.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((param.length + 3) % 4);
                const payload = decodeURIComponent(escape(atob(b64)));
                const i = payload.indexOf('|');
                if (i < 0) return null;
                const name = payload.slice(0, i).trim().slice(0, 60) || 'Shared board';
                const frames = payload.slice(i + 1).split(',').map(x => x.trim()).filter(Boolean);

        // Filter Bar (sits directly under the header; its real height is measured by App)
        const FilterBar = ({ activeTags, toggleTag, clearFilters, barRef, top }) => (
            <div ref={barRef} style={{

        );

        // Popover to choose which board a frame goes to (or create one)
        const BoardPicker = ({ frame, boardsApi, onDone, anchorRect }) => {
            const { boards, toggleFrame, createBoard, savedIn } = boardsApi;
            const [creating, setCreating] = useState(boards.length === 0);
            const [name, setName] = useState('');
            const ref = useRef(null);
            const inputRef = useRef(null);
            const saved = new Set(savedIn(frame.id));

            useEffect(() => {
                const onDown = (e) => { if (ref.current && !ref.current.contains(e.target)) onDone(); };
                const onKey = (e) => { if (e.key === 'Escape') { e.stopPropagation(); onDone(); } };
                document.addEventListener('mousedown', onDown);
                document.addEventListener('keydown', onKey, true);
                return () => { document.removeEventListener('mousedown', onDown); document.removeEventListener('keydown', onKey, true); };
            }, [onDone]);
            useEffect(() => { if (creating && inputRef.current) inputRef.current.focus(); }, [creating]);

            const submitNew = () => {
                const n = name.trim(); if (!n) return;
                const b = createBoard(n, [frame.id]);
                onDone({ text: `Saved to “${b.name}”` });
            };

            // Position: below the anchor if given, else centered in viewport (mobile / modal)
            const style = anchorRect
                ? { position: 'fixed', top: Math.min(anchorRect.bottom + 8, window.innerHeight - 320), left: Math.max(8, Math.min(anchorRect.right - 260, window.innerWidth - 268)) }
                : { position: 'fixed', top: '50%', left: '50%', transform: 'translate(-50%, -50%)' };

            return (
                <div ref={ref} onClick={(e) => e.stopPropagation()} role="dialog" aria-label="Choose a board" style={{
                    ...style, zIndex: 350, width: '260px',
                    background: 'var(--bg-secondary)', border: '1px solid var(--border)', borderRadius: '12px',

                    <div style={{ fontSize: '10px', letterSpacing: '.15em', textTransform: 'uppercase', color: 'var(--text-tertiary)', padding: '6px 10px 8px' }}>

                    <div style={{ maxHeight: '200px', overflowY: 'auto' }}>
                        {boards.map(b => {
                            const on = saved.has(b.id);
                            return (
                                <button key={b.id} onClick={() => { const added = toggleFrame(b.id, frame.id); onDone({ text: added ? `Saved to “${b.name}”` : `Removed from “${b.name}”` }); }}
                                    style={{ width: '100%', display: 'flex', alignItems: 'center', gap: '10px', padding: '9px 10px', background: 'none', border: 'none', borderRadius: '8px', cursor: 'pointer', color: 'var(--text-primary)', fontSize: '13px', textAlign: 'left' }}

                                    onMouseLeave={(e) => e.currentTarget.style.background = 'none'}>

                                    <span style={{ fontSize: '11px', color: 'var(--text-tertiary)', fontFamily: "'JetBrains Mono', monospace" }}>{b.frames.length}</span>
                                </button>
                            );
                        })}
                    </div>
                    {creating ? (
                        <div style={{ display: 'flex', gap: '6px', padding: '6px 4px 2px' }}>
                            <input ref={inputRef} value={name} onChange={(e) => setName(e.target.value)}

                                placeholder="New board name" maxLength={60}

        // Parse "16:9" / "2.39:1" into a CSS aspect-ratio number; default 16/9
        const parseAspect = (a) => {
            if (!a) return 16 / 9;
            const m = String(a).match(/^\s*([\d.]+)\s*:\s*([\d.]+)\s*$/);
            if (!m) return 16 / 9;
            const w = parseFloat(m[1]), h = parseFloat(m[2]);
            return (w > 0 && h > 0) ? w / h : 16 / 9;
        };

        // Frame Card — shows the WHOLE frame at its true aspect ratio (a composition
        // reference must never crop the composition). Size is stable per frame, so
        // cards don't jump when filters change.
        const FrameCard = ({ frame, index, onClick, isSaved, onSave }) => {
            const [loaded, setLoaded] = useState(false);
            const [failed, setFailed] = useState(false);
            const [hovered, setHovered] = useState(false);
            const [ratio, setRatio] = useState(() => parseAspect(frame.aspect));

            const handleOpen = () => onClick(frame);
            const showSave = hovered || isSaved;

            return (
                <div
                    role="button"
                    tabIndex={0}
                    aria-label={`${frame.source || 'Frame'} — ${frame.director || ''}`}
                    onClick={handleOpen}
                    onKeyDown={(e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); handleOpen(); } }}
                    onMouseEnter={() => setHovered(true)}
                    onMouseLeave={() => setHovered(false)}
                    className="frame-card"
                    style={{
                        position: 'relative',
                        width: '100%',
                        aspectRatio: String(ratio),
                        borderRadius: '4px',
                        overflow: 'hidden',
                        cursor: 'pointer',
                        background: 'var(--bg-secondary)',
                        transition: 'transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s',
                        transform: hovered ? 'scale(1.02)' : 'scale(1)',
                        boxShadow: hovered ? '0 20px 60px rgba(0,0,0,0.6)' : 'none',
                        animation: 'fadeIn 0.4s ease-out',
                        animationDelay: `${Math.min((index % 24) * 0.02, 0.5)}s`,
                        animationFillMode: 'both',
                        outline: 'none'
                    }}
                >
                    {/* Loading State */}
                    {!loaded && !failed && (
                        <div className="shimmer" style={{ position: 'absolute', inset: 0 }} />
                    )}

                    {/* Broken media state (instead of an empty box) */}
                    {failed && (
                        <div style={{
                            position: 'absolute', inset: 0, display: 'flex', flexDirection: 'column',
                            alignItems: 'center', justifyContent: 'center', gap: '6px',
                            color: 'var(--text-tertiary)', fontSize: '11px', letterSpacing: '0.05em'
                        }}>
                            <Icons.Film />
                            <span>Unavailable</span>
                        </div>
                    )}

                    {!failed && (
                        <img
                            src={frame.image}
                            alt={frame.source ? `${frame.source} — ${frame.director}` : frame.title}
                            loading="lazy"
                            decoding="async"
                            onLoad={(e) => {
                                const im = e.currentTarget;
                                if (im.naturalWidth && im.naturalHeight) setRatio(im.naturalWidth / im.naturalHeight);
                                setLoaded(true);
                            }}
                            onError={() => { setFailed(true); setLoaded(true); }}
                            style={{
                                position: 'absolute',
                                inset: 0,
                                width: '100%',
                                height: '100%',
                                objectFit: 'cover',
                                opacity: loaded ? 1 : 0,
                                transition: 'opacity 0.3s',
                                pointerEvents: 'none'
                            }}
                        />
                    )}

                    {/* Save to board */}
                    {onSave && (
                        <button
                            className="card-save"
                            aria-label={isSaved ? 'Saved — change boards' : 'Save to board'}
                            aria-pressed={isSaved}
                            onClick={(e) => { e.stopPropagation(); onSave(frame, e.currentTarget.getBoundingClientRect()); }}
                            style={{
                                position: 'absolute', top: '10px', right: '10px',
                                width: '34px', height: '34px', minHeight: 0, minWidth: 0, padding: 0,
                                borderRadius: '8px', border: '1px solid rgba(255,255,255,.12)',
                                background: isSaved ? 'var(--accent)' : 'rgba(0,0,0,.65)',
                                color: isSaved ? '#000' : '#fff',
                                display: 'flex', alignItems: 'center', justifyContent: 'center',
                                cursor: 'pointer', backdropFilter: 'blur(8px)',
                                opacity: showSave ? 1 : 0, transform: showSave ? 'translateY(0)' : 'translateY(-4px)',
                                transition: 'opacity .2s, transform .2s, background .2s'
                            }}
                        >
                            <Icons.Bookmark filled={isSaved} size={15} />
                        </button>
                    )}
                </div>
            );
        };

        // Frame Detail Modal
        const FrameModal = ({ frame, isMobile, onClose, onFilterByDirector, onFilterBySource, onFilterByTag, isSaved, onSave }) => {
            const [promptCopied, setPromptCopied] = useState(false);
            const [promptExpanded, setPromptExpanded] = useState(false);
            const [imgLoaded, setImgLoaded] = useState(false);
            const [downloadMode, setDownloadMode] = useState(null); // null | 'working' | 'link'
            const copyTimer = useRef(null);

            // Reset per-frame state when switching frames
            useEffect(() => {
                setPromptExpanded(false);
                setPromptCopied(false);
                setImgLoaded(false);
                setDownloadMode(null);
            }, [frame && frame.id]);

            // Don't leave a timer running after the modal closes
            useEffect(() => () => { if (copyTimer.current) clearTimeout(copyTimer.current); }, []);

            // Close on Escape key
            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (e.key === 'Escape') onClose();
                };
                document.addEventListener('keydown', handleKeyDown);
                // Prevent body scroll when modal is open (restore whatever it was, so a
                // modal underneath keeps its own lock)
                const prevOverflow = document.body.style.overflow;
                document.body.style.overflow = 'hidden';
                return () => {
                    document.removeEventListener('keydown', handleKeyDown);
                    document.body.style.overflow = prevOverflow;
                };
            }, [onClose]);

            if (!frame) return null;

            return (
                <div
                    onClick={onClose}
                    role="dialog"
                    aria-modal="true"
                    aria-label={frame.source || frame.title}
                    style={{
                        position: 'fixed',
                        inset: 0,
                        zIndex: 230,
                        background: 'rgba(0,0,0,0.95)',
                        display: 'flex',
                        alignItems: 'flex-start',
                        justifyContent: 'center',
                        padding: isMobile ? '16px' : '40px',
                        overflowY: 'auto',
                        overscrollBehavior: 'contain',
                        animation: 'fadeIn 0.3s ease-out'
                    }}
                >
                    {/* Close button for mobile */}
                    <button
                        onClick={onClose}
                        style={{
                            position: 'fixed',
                            top: '16px',
                            right: '16px',
                            zIndex: 240,
                            width: '44px',
                            height: '44px',
                            display: 'flex',
                            alignItems: 'center',
                            justifyContent: 'center',
                            background: 'rgba(0,0,0,0.8)',
                            border: '1px solid var(--border)',
                            borderRadius: '50%',
                            color: 'var(--text-primary)',
                            cursor: 'pointer'
                        }}
                    >
                        <Icons.X />
                    </button>

                    <div
                        onClick={(e) => e.stopPropagation()}
                        className="modal-content"
                        style={{
                            maxWidth: '1400px',
                            width: '100%',
                            display: 'grid',
                            gridTemplateColumns: isMobile ? '1fr' : 'minmax(0, 1fr) 380px',
                            alignItems: 'stretch',
                            gap: isMobile ? '20px' : '40px',
                            animation: 'scaleIn 0.3s ease-out',
                            // Desktop: modal is exactly viewport height; the sidebar scrolls internally.
                            // Mobile: natural height, the overlay scrolls.
                            height: isMobile ? 'auto' : 'calc(100vh - 80px)',
                            margin: isMobile ? '60px 0 20px' : 'auto'
                        }}
                    >
                        {/* Image/GIF */}
                        <div style={{
                            position: 'relative',
                            borderRadius: '8px',
                            overflow: 'hidden',
                            background: 'var(--bg-secondary)',
                            display: 'flex',
                            alignItems: 'center',
                            justifyContent: 'center',
                            minHeight: 0,
                            height: isMobile ? 'auto' : '100%'
                        }}>
                            {!imgLoaded && (
                                <div className="shimmer" style={{
                                    position: 'absolute', inset: 0,
                                    minHeight: isMobile ? '200px' : 'auto'
                                }} />
                            )}
                            <img
                                src={frame.image}
                                alt={frame.source ? `${frame.source} — ${frame.director}` : frame.title}
                                onLoad={() => setImgLoaded(true)}
                                onError={() => setImgLoaded(true)}
                                style={{
                                    maxWidth: '100%',
                                    maxHeight: '100%',
                                    width: isMobile ? '100%' : 'auto',
                                    height: 'auto',
                                    objectFit: 'contain',
                                    display: 'block',
                                    opacity: imgLoaded ? 1 : 0,
                                    transition: 'opacity 0.3s'
                                }}
                            />
                            {/* Aspect ratio badge */}
                            <div style={{
                                position: 'absolute',
                                top: '12px',
                                left: '12px',
                                padding: '6px 12px',
                                background: 'rgba(0,0,0,0.7)',
                                borderRadius: '4px',
                                fontSize: '11px',
                                fontFamily: "'JetBrains Mono', monospace",
                                letterSpacing: '0.05em'
                            }}>
                                {frame.aspect}
                            </div>
                        </div>

                        {/* Details */}
                        <div className="modal-sidebar" style={{
                            display: 'flex',
                            flexDirection: 'column',
                            minHeight: 0,
                            height: isMobile ? 'auto' : '100%'
                        }}>
                          {/* Scrollable info area */}
                          <div className="modal-sidebar-scroll" style={{
                              flex: 1,
                              minHeight: 0,
                              overflowY: isMobile ? 'visible' : 'auto',
                              paddingRight: isMobile ? 0 : '8px',
                              marginRight: isMobile ? 0 : '-8px'
                          }}>
                            {/* Project (headline) + Arabic + meta */}
                            <h2
                                onClick={() => onFilterBySource(frame.source)}
                                title="View all frames from this project"
                                style={{
                                    fontSize: isMobile ? '22px' : '26px',
                                    fontWeight: 600,
                                    letterSpacing: '-0.02em',
                                    lineHeight: 1.2,
                                    marginBottom: '6px',
                                    cursor: 'pointer',
                                    transition: 'color 0.2s'
                                }}
                                onMouseEnter={(e) => e.currentTarget.style.color = 'var(--accent)'}
                                onMouseLeave={(e) => e.currentTarget.style.color = ''}
                            >
                                {frame.source}
                            </h2>
                            {frame.sourceAr && (
                                <div dir="rtl" style={{
                                    fontFamily: "'HT Moshreq Pro', sans-serif",
                                    fontSize: isMobile ? '18px' : '21px',
                                    color: 'var(--accent)',
                                    textAlign: 'left',
                                    marginBottom: '8px'
                                }}>
                                    {frame.sourceAr}
                                </div>
                            )}
                            <p style={{
                                fontSize: '12px',
                                fontFamily: "'JetBrains Mono', monospace",
                                color: 'var(--text-tertiary)',
                                marginBottom: '24px'
                            }}>
                                {frame.year} · #{frame.id}
                            </p>

                            {/* Metadata Grid */}
                            <div style={{
                                display: 'grid',
                                gridTemplateColumns: '1fr 1fr',
                                gap: '24px',
                                marginBottom: '24px'
                            }}>
                                <div>
                                    <div style={{
                                        fontSize: '10px',
                                        textTransform: 'uppercase',
                                        letterSpacing: '0.15em',
                                        color: 'var(--text-tertiary)',
                                        marginBottom: '6px'
                                    }}>
                                        Director
                                    </div>
                                    <div
                                        onClick={() => onFilterByDirector(frame.director)}
                                        style={{
                                            fontSize: '14px',
                                            cursor: 'pointer',
                                            transition: 'color 0.2s',
                                            borderBottom: '1px dashed var(--text-tertiary)',
                                            display: 'inline-block'
                                        }}
                                        onMouseEnter={(e) => e.target.style.color = 'var(--accent)'}
                                        onMouseLeave={(e) => e.target.style.color = 'var(--text-primary)'}
                                        title="View all frames by this director"
                                    >
                                        {frame.director}
                                    </div>
                                </div>
                                {frame.dp && (
                                    <div>
                                        <div style={{
                                            fontSize: '10px',
                                            textTransform: 'uppercase',
                                            letterSpacing: '0.15em',
                                            color: 'var(--text-tertiary)',
                                            marginBottom: '6px'
                                        }}>
                                            Cinematographer
                                        </div>
                                        <div style={{ fontSize: '14px' }}>{frame.dp}</div>
                                    </div>
                                )}
                                <div>
                                    <div style={{
                                        fontSize: '10px',
                                        textTransform: 'uppercase',
                                        letterSpacing: '0.15em',
                                        color: 'var(--text-tertiary)',
                                        marginBottom: '6px'
                                    }}>
                                        Year
                                    </div>
                                    <div style={{ fontSize: '14px' }}>{frame.year}</div>
                                </div>
                                <div>
                                    <div style={{
                                        fontSize: '10px',
                                        textTransform: 'uppercase',
                                        letterSpacing: '0.15em',
                                        color: 'var(--text-tertiary)',
                                        marginBottom: '6px'
                                    }}>
                                        Mood
                                    </div>
                                    <div style={{ fontSize: '14px' }}>{frame.mood}</div>
                                </div>
                                <div>
                                    <div style={{
                                        fontSize: '10px',
                                        textTransform: 'uppercase',
                                        letterSpacing: '0.15em',
                                        color: 'var(--text-tertiary)',
                                        marginBottom: '6px'
                                    }}>
                                        Lighting
                                    </div>
                                    <div style={{ fontSize: '14px' }}>{frame.lighting}</div>
                                </div>
                            </div>

                            {/* Color Palette */}
                            <div style={{ marginBottom: '24px' }}>
                                <div style={{
                                    fontSize: '10px',
                                    textTransform: 'uppercase',
                                    letterSpacing: '0.15em',
                                    color: 'var(--text-tertiary)',
                                    marginBottom: '12px'
                                }}>
                                    Color Palette
                                </div>
                                <div style={{ display: 'flex', gap: '8px' }}>
                                    {(frame.color || []).map((c, i) => (
                                        <div key={i} style={{ textAlign: 'center' }}>
                                            <div style={{
                                                width: '48px',
                                                height: '48px',
                                                borderRadius: '8px',
                                                background: c,
                                                marginBottom: '6px'
                                            }} />
                                            <div style={{
                                                fontSize: '10px',
                                                fontFamily: "'JetBrains Mono', monospace",
                                                color: 'var(--text-tertiary)'
                                            }}>
                                                {c}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            {/* Tags — only shown when the frame actually has any */}
                            {(frame.tags || []).length > 0 && (
                                <div style={{ marginBottom: '24px' }}>
                                    <div style={{
                                        fontSize: '10px',
                                        textTransform: 'uppercase',
                                        letterSpacing: '0.15em',
                                        color: 'var(--text-tertiary)',
                                        marginBottom: '12px'
                                    }}>
                                        Tags
                                    </div>
                                    <div style={{ display: 'flex', flexWrap: 'wrap', gap: '8px' }}>
                                        {frame.tags.map(tag => (
                                            <button
                                                key={tag}
                                                onClick={() => onFilterByTag(tag)}
                                                style={{
                                                    padding: '6px 14px',
                                                    background: 'var(--bg-tertiary)',
                                                    borderRadius: '100px',
                                                    fontSize: '12px',
                                                    border: 'none',
                                                    color: 'var(--text-primary)',
                                                    cursor: 'pointer',
                                                    transition: 'all 0.2s'
                                                }}
                                                onMouseEnter={(e) => {
                                                    e.currentTarget.style.background = 'var(--accent)';
                                                    e.currentTarget.style.color = '#000';
                                                }}
                                                onMouseLeave={(e) => {
                                                    e.currentTarget.style.background = 'var(--bg-tertiary)';
                                                    e.currentTarget.style.color = 'var(--text-primary)';
                                                }}
                                            >
                                                {tag}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {/* AI Image Prompt */}
                            {frame.prompt && (
                                <div style={{ marginBottom: '24px' }}>
                                    <div style={{
                                        display: 'flex',
                                        alignItems: 'center',
                                        justifyContent: 'space-between',
                                        marginBottom: '12px'
                                    }}>
                                        <div style={{
                                            fontSize: '10px',
                                            textTransform: 'uppercase',
                                            letterSpacing: '0.15em',
                                            color: 'var(--text-tertiary)'
                                        }}>
                                            AI Image Prompt
                                        </div>
                                        <button
                                            onClick={async () => {
                                                try {
                                                    await navigator.clipboard.writeText(frame.prompt);
                                                } catch (e) {
                                                    const ta = document.createElement('textarea');
                                                    ta.value = frame.prompt;
                                                    ta.style.position = 'fixed';
                                                    ta.style.opacity = '0';
                                                    document.body.appendChild(ta);
                                                    ta.select();
                                                    document.execCommand('copy');
                                                    document.body.removeChild(ta);
                                                }
                                                setPromptCopied(true);
                                                if (copyTimer.current) clearTimeout(copyTimer.current);
                                                copyTimer.current = setTimeout(() => setPromptCopied(false), 2000);
                                            }}
                                            style={{
                                                display: 'flex',
                                                alignItems: 'center',
                                                gap: '6px',
                                                padding: '6px 12px',
                                                background: promptCopied ? 'var(--accent)' : 'var(--bg-tertiary)',
                                                color: promptCopied ? '#000' : 'var(--text-primary)',
                                                border: '1px solid var(--border)',
                                                borderRadius: '100px',
                                                fontSize: '11px',
                                                fontWeight: 600,
                                                cursor: 'pointer',
                                                transition: 'all 0.2s'
                                            }}
                                        >
                                            <Icons.Copy />
                                            {promptCopied ? 'Copied!' : 'Copy Prompt'}
                                        </button>
                                    </div>
                                    <div style={{
                                        padding: '12px 14px',
                                        background: 'var(--bg-tertiary)',
                                        border: '1px solid var(--border)',
                                        borderRadius: '10px',
                                        fontSize: '13px',
                                        lineHeight: 1.6,
                                        color: 'var(--text-secondary)',
                                        userSelect: 'text'
                                    }}>
                                        <div
                                            className={promptExpanded ? '' : 'prompt-clamp'}
                                            style={{ transition: 'all 0.2s' }}
                                        >
                                            {frame.prompt}
                                        </div>
                                        <button
                                            onClick={() => setPromptExpanded(!promptExpanded)}
                                            style={{
                                                marginTop: '8px',
                                                padding: 0,
                                                background: 'none',
                                                border: 'none',
                                                color: 'var(--accent)',
                                                fontSize: '12px',
                                                fontWeight: 600,
                                                cursor: 'pointer',
                                                display: 'inline-flex',
                                                alignItems: 'center',
                                                gap: '4px'
                                            }}
                                        >
                                            {promptExpanded ? 'Show less ↑' : 'Show more ↓'}
                                        </button>
                                    </div>
                                </div>
                            )}
                          </div>

                            {/* Actions (pinned at bottom on desktop) */}
                            <div style={{
                                marginTop: isMobile ? '8px' : '16px',
                                paddingTop: isMobile ? 0 : '16px',
                                borderTop: isMobile ? 'none' : '1px solid var(--border)',
                                display: 'flex',
                                gap: '12px',
                                flexShrink: 0
                            }}>
                                {onSave && (
                                    <button
                                        onClick={(e) => onSave(frame, e.currentTarget.getBoundingClientRect())}
                                        aria-pressed={isSaved}
                                        style={{
                                            display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '8px',
                                            padding: '14px 18px',
                                            background: isSaved ? 'var(--accent)' : 'var(--bg-tertiary)',
                                            color: isSaved ? '#000' : 'var(--text-primary)',
                                            border: `1px solid ${isSaved ? 'var(--accent)' : 'var(--border)'}`,
                                            borderRadius: '8px', cursor: 'pointer', fontSize: '13px', fontWeight: 600,
                                            transition: 'all .2s', flexShrink: 0
                                        }}
                                    >
                                        <Icons.Bookmark filled={isSaved} size={15} />
                                        {isSaved ? 'Saved' : 'Save'}
                                    </button>
                                )}
                                {/* Blob download needs CORS on the R2 bucket. If that fails we
                                    swap in a real link the user clicks — window.open() after an
                                    await gets eaten by popup blockers. */}
                                {downloadMode === 'link' ? (
                                    <a
                                        href={frame.image}
                                        target="_blank"
                                        rel="noopener noreferrer"
                                        style={{
                                            flex: 1,
                                            display: 'flex',
                                            alignItems: 'center',
                                            justifyContent: 'center',
                                            gap: '8px',
                                            padding: '14px 20px',
                                            background: 'var(--accent)',
                                            color: 'var(--bg-primary)',
                                            border: 'none',
                                            borderRadius: '8px',
                                            cursor: 'pointer',
                                            fontSize: '13px',
                                            fontWeight: 600,
                                            textDecoration: 'none'
                                        }}
                                    >
                                        <Icons.External />
                                        Open image in new tab
                                    </a>
                                ) : (
                                    <button
                                        onClick={async () => {
                                            setDownloadMode('working');
                                            try {
                                                const response = await fetch(frame.image);
                                                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                                                const blob = await response.blob();
                                                const url = window.URL.createObjectURL(blob);
                                                const a = document.createElement('a');
                                                a.href = url;
                                                const base = (frame.source || frame.title || 'frame')
                                                    .replace(/[\/\\:*?"<>|#]/g, '_').trim().slice(0, 80);
                                                const ext = (frame.file || '').split('.').pop().split('?')[0] || 'gif';
                                                a.download = `berwaz_${base}_${frame.id}.${ext}`;
                                                document.body.appendChild(a);
                                                a.click();
                                                document.body.removeChild(a);
                                                window.URL.revokeObjectURL(url);
                                                setDownloadMode(null);
                                            } catch (err) {
                                                console.warn('Direct download blocked (R2 bucket needs a CORS rule); offering link instead.', err);
                                                setDownloadMode('link');
                                            }
                                        }}
                                        disabled={downloadMode === 'working'}
                                        style={{
                                            flex: 1,
                                            display: 'flex',
                                            alignItems: 'center',
                                            justifyContent: 'center',
                                            gap: '8px',
                                            padding: '14px 20px',
                                            background: 'var(--accent)',
                                            color: 'var(--bg-primary)',
                                            border: 'none',
                                            borderRadius: '8px',
                                            cursor: downloadMode === 'working' ? 'wait' : 'pointer',
                                            fontSize: '13px',
                                            fontWeight: 600,
                                            opacity: downloadMode === 'working' ? 0.7 : 1,
                                            transition: 'all 0.2s'
                                        }}
                                    >
                                        <Icons.Download />
                                        {downloadMode === 'working' ? 'Preparing…' : 'Download'}
                                    </button>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // Shuffle array helper (Fisher-Yates)
        const shuffleArray = (array) => {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        };

        // About Modal
        const AboutModal = ({ onClose, isMobile }) => {
            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (e.key === 'Escape') onClose();
                };
                document.addEventListener('keydown', handleKeyDown);
                document.body.style.overflow = 'hidden';
                return () => {
                    document.removeEventListener('keydown', handleKeyDown);
                    document.body.style.overflow = '';
                };
            }, [onClose]);

            return (
                <div
                    onClick={onClose}
                    style={{
                        position: 'fixed',
                        inset: 0,
                        zIndex: 200,
                        background: 'rgba(0,0,0,0.95)',
                        display: 'flex',
                        alignItems: 'center',
                        justifyContent: 'center',
                        padding: isMobile ? '16px' : '40px',
                        animation: 'fadeIn 0.3s ease-out'
                    }}
                >
                    <div
                        onClick={(e) => e.stopPropagation()}
                        style={{
                            maxWidth: '600px',
                            width: '100%',
                            background: 'var(--bg-secondary)',
                            borderRadius: '16px',
                            padding: isMobile ? '24px' : '48px',
                            border: '1px solid var(--border)',
                            animation: 'scaleIn 0.3s ease-out',
                            textAlign: 'center'
                        }}
                    >
                        {/* Logo */}
                        <div style={{ marginBottom: '24px' }}>
                            <svg width="80" height="80" viewBox="0 0 700 450" fill="none" style={{ margin: '0 auto' }}>
                                <path d="M78.5 226C28.5 196 0 176 0 176L580 125C580 125 620 145 620 165C620 185 580 205 580 205L78.5 226Z" fill="#ffd900"/>
                                <polygon points="600,100 640,130 620,165 580,135" fill="#ffd900"/>
                                <rect x="295" y="340" width="50" height="50" transform="rotate(45 320 365)" fill="#ffd900"/>
                            </svg>
                        </div>

                        <h2 style={{
                            fontSize: '36px',
                            fontWeight: 700,
                            color: 'var(--accent)',
                            marginBottom: '24px'
                        }}>
                            Berwaz
                        </h2>

                        <p style={{
                            fontSize: '16px',
                            color: 'var(--text-secondary)',
                            marginBottom: '32px',
                            lineHeight: 1.8
                        }}>
                            A visual study platform for filmmakers, students, and researchers to analyze Saudi-directed films through curated scene loops.
                        </p>

                        <button
                            onClick={onClose}
                            style={{
                                marginTop: '32px',
                                padding: '12px 32px',
                                background: 'var(--accent)',
                                color: 'var(--bg-primary)',
                                border: 'none',
                                borderRadius: '8px',
                                fontSize: '14px',
                                fontWeight: 600,
                                cursor: 'pointer',
                                transition: 'all 0.2s'
                            }}
                        >
                            Close
                        </button>
                    </div>
                </div>
            );
        };

        // Featured Visuals Modal
        const FeaturedModal = ({ onClose, frames, onSelectFrame, isMobile }) => {
            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (e.key === 'Escape') onClose();
                };
                document.addEventListener('keydown', handleKeyDown);
                document.body.style.overflow = 'hidden';
                return () => {
                    document.removeEventListener('keydown', handleKeyDown);
                    document.body.style.overflow = '';
                };
            }, [onClose]);

            // Get a curated selection of featured frames (changes every 8 hours)
            const featuredFrames = useMemo(() => {
                // Use 8-hour period as seed for consistent selection
                const now = new Date();
                const hoursSinceEpoch = Math.floor(now.getTime() / (1000 * 60 * 60));
                const periodSeed = Math.floor(hoursSinceEpoch / 8); // Changes every 8 hours

                // Seeded random function
                const seededRandom = (seed) => {
                    const x = Math.sin(seed) * 10000;
                    return x - Math.floor(x);
                };

                // Seed by frame IDENTITY, not by array position — `frames` is shuffled on
                // mount, so seeding by index re-rolled the selection on every page load
                // instead of holding steady for the 8-hour window.
                const shuffled = [...frames].map((frame) => ({
                    frame,
                    sort: seededRandom(periodSeed * 7919 + Number(frame.id))
                })).sort((a, b) => a.sort - b.sort).map(item => item.frame);

                return shuffled.slice(0, 6);
            }, [frames]);

            return (
                <div
                    onClick={onClose}
                    style={{
                        position: 'fixed',
                        inset: 0,
                        zIndex: 200,
                        background: 'rgba(0,0,0,0.95)',
                        display: 'flex',
                        alignItems: 'flex-start',
                        justifyContent: 'center',
                        padding: isMobile ? '16px' : '40px',
                        animation: 'fadeIn 0.3s ease-out',
                        overflowY: 'auto',
                        overscrollBehavior: 'contain',
                        overscrollBehavior: 'contain'
                    }}
                >
                    <div
                        onClick={(e) => e.stopPropagation()}
                        style={{
                            maxWidth: '1200px',
                            width: '100%',
                            background: 'var(--bg-secondary)',
                            borderRadius: '16px',
                            padding: isMobile ? '20px' : '32px',
                            border: '1px solid var(--border)',
                            animation: 'scaleIn 0.3s ease-out',
                            marginTop: '20px',
                            marginBottom: '20px'
                        }}
                    >
                        <div style={{ textAlign: 'center', marginBottom: '24px' }}>
                            <h2 style={{
                                fontSize: '24px',
                                fontWeight: 700,
                                color: 'var(--accent)',
                                marginBottom: '4px'
                            }}>
                                Featured Visuals
                            </h2>
                            <p style={{
                                fontSize: '13px',
                                color: 'var(--text-secondary)'
                            }}>
                                Curated frames from our collection
                            </p>
                        </div>

                        <div style={{
                            display: 'grid',
                            gridTemplateColumns: 'repeat(auto-fill, minmax(min(280px, 100%), 1fr))',
                            gap: '16px'
                        }}>
                            {featuredFrames.map((frame, index) => (
                                <div
                                    key={frame.id}
                                    onClick={() => {
                                        onSelectFrame(frame);
                                        onClose();
                                    }}
                                    style={{
                                        position: 'relative',
                                        aspectRatio: '16/9',
                                        borderRadius: '12px',
                                        overflow: 'hidden',
                                        cursor: 'pointer',
                                        transition: 'transform 0.3s, box-shadow 0.3s'
                                    }}
                                    onMouseEnter={(e) => {
                                        e.currentTarget.style.transform = 'scale(1.02)';
                                        e.currentTarget.style.boxShadow = '0 10px 40px rgba(255,217,0,0.2)';
                                    }}
                                    onMouseLeave={(e) => {
                                        e.currentTarget.style.transform = 'scale(1)';
                                        e.currentTarget.style.boxShadow = 'none';
                                    }}
                                >
                                    <img
                                        src={frame.image}
                                        alt={frame.title}
                                        loading="lazy"
                                        style={{
                                            width: '100%',
                                            height: '100%',
                                            objectFit: 'cover'
                                        }}
                                    />
                                </div>
                            ))}
                        </div>

                        <div style={{ textAlign: 'center', marginTop: '24px' }}>
                            <button
                                onClick={onClose}
                                style={{
                                    padding: '10px 28px',
                                    background: 'var(--accent)',
                                    color: 'var(--bg-primary)',
                                    border: 'none',
                                    borderRadius: '8px',
                                    fontSize: '14px',
                                    fontWeight: 600,
                                    cursor: 'pointer',
                                    transition: 'all 0.2s'
                                }}
                            >
                                Close
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // ═══════════════════════════════════════════════════════════════
        // BOARDS MODAL — manage moodboards, view a board, export
        // ═══════════════════════════════════════════════════════════════
        const useModalChrome = (onClose, escEnabled = true) => {
            useEffect(() => {
                const onKey = (e) => { if (e.key === 'Escape' && escEnabled) onClose(); };
                document.addEventListener('keydown', onKey);
                const prev = document.body.style.overflow;
                document.body.style.overflow = 'hidden';
                return () => { document.removeEventListener('keydown', onKey); document.body.style.overflow = prev; };
            }, [onClose, escEnabled]);
        };

        // Render a board as a single contact-sheet PNG (needs CORS on R2; falls back gracefully)
        const renderBoardImage = async (board, frames) => {
            const items = board.frames.map(id => frames.find(f => f.id === id)).filter(Boolean);
            if (!items.length) throw new Error('empty');
            const cols = items.length <= 4 ? 2 : items.length <= 9 ? 3 : 4;
            const W = 480, H = 270, PAD = 24, GAP = 16, HEADER = 110;
            const rows = Math.ceil(items.length / cols);
            const c = document.createElement('canvas');
            c.width = PAD * 2 + cols * W + (cols - 1) * GAP;
            c.height = HEADER + PAD + rows * (H + 34 + GAP) + PAD;
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#0a0a0a'; ctx.fillRect(0, 0, c.width, c.height);
            ctx.fillStyle = '#ffd900'; ctx.font = '700 34px "Space Grotesk", Arial, sans-serif';
            ctx.fillText(board.name, PAD, 54);
            ctx.fillStyle = '#777'; ctx.font = '13px "JetBrains Mono", monospace';
            ctx.fillText(`${items.length} frames · Berwaz · برواز`, PAD, 82);
            const load = (src) => new Promise((res, rej) => { const im = new Image(); im.crossOrigin = 'anonymous'; im.onload = () => res(im); im.onerror = rej; im.src = src; });
            for (let i = 0; i < items.length; i++) {
                const f = items[i]; const r = Math.floor(i / cols), col = i % cols;
                const x = PAD + col * (W + GAP), y = HEADER + PAD + r * (H + 34 + GAP);
                ctx.fillStyle = '#161616'; ctx.fillRect(x, y, W, H);
                try {
                    const im = await load(f.image);
                    const sc = Math.max(W / im.width, H / im.height);
                    const dw = im.width * sc, dh = im.height * sc;
                    ctx.save(); ctx.beginPath(); ctx.rect(x, y, W, H); ctx.clip();
                    ctx.drawImage(im, x + (W - dw) / 2, y + (H - dh) / 2, dw, dh); ctx.restore();
                } catch {
                    ctx.fillStyle = '#333'; ctx.font = '12px Arial'; ctx.fillText('image unavailable', x + 16, y + H / 2);
                }
                ctx.fillStyle = '#eee'; ctx.font = '600 13px "Space Grotesk", Arial, sans-serif';
                ctx.fillText((f.source || '').slice(0, 52), x, y + H + 18);
                ctx.fillStyle = '#777'; ctx.font = '11px "JetBrains Mono", monospace';
                ctx.fillText(`${f.director}  ·  #${f.id}`, x, y + H + 32);
            }
            return new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('toBlob failed')), 'image/png'));
        };

        const BoardsModal = ({ onClose, boardsApi, frames, initialBoardId, onOpenFrame, onToast, isMobile, escEnabled = true }) => {
            const { boards, createBoard, renameBoard, deleteBoard, removeFrame, moveFrame } = boardsApi;
            const [activeId, setActiveId] = useState(initialBoardId || null);
            const [editing, setEditing] = useState(false);
            const [nameDraft, setNameDraft] = useState('');
            const [newName, setNewName] = useState('');
            const [busy, setBusy] = useState(null);
            const [dragIdx, setDragIdx] = useState(null);
            useModalChrome(onClose, escEnabled);

            const active = boards.find(b => b.id === activeId) || null;
            useEffect(() => { if (activeId && !active) setActiveId(null); }, [activeId, active]);
            const byId = useMemo(() => Object.fromEntries(frames.map(f => [f.id, f])), [frames]);
            const items = active ? active.frames.map(id => byId[id]).filter(Boolean) : [];

            const copy = async (text) => {
                try { await navigator.clipboard.writeText(text); return true; }
                catch { const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); document.body.removeChild(ta); return ok; }
            };
            const shareLink = async () => { if (await copy(encodeBoardLink(active))) onToast({ text: 'Share link copied' }); };
            const copyPrompts = async () => {
                const txt = items.map((f, i) => `${i + 1}. ${f.source} — ${f.director} (#${f.id})\n${f.prompt || ''}`).join('\n\n');
                if (await copy(txt)) onToast({ text: `${items.length} prompts copied` });
            };
            const exportImage = async () => {
                setBusy('image');
                try {
                    const blob = await renderBoardImage(active, frames);
                    const url = URL.createObjectURL(blob); const a = document.createElement('a');
                    a.href = url; a.download = `berwaz_${active.name.replace(/[\/\\:*?"<>|#]/g, '_')}.png`;
                    document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
                    onToast({ text: 'Board image downloaded' });
                } catch (e) {
                    console.warn('Board export failed', e);
                    onToast({ text: 'Image export needs CORS on the image host — share link copied instead' });
                    await copy(encodeBoardLink(active));
                } finally { setBusy(null); }
            };

            const Tile = ({ f, i }) => {
                const [hover, setHover] = useState(false);
                return (
                    <div
                        draggable={!isMobile}
                        onDragStart={() => setDragIdx(i)}
                        onDragOver={(e) => e.preventDefault()}
                        onDrop={() => { if (dragIdx !== null && dragIdx !== i) moveFrame(active.id, dragIdx, i); setDragIdx(null); }}
                        onMouseEnter={() => setHover(true)} onMouseLeave={() => setHover(false)}
                        style={{ position: 'relative', borderRadius: '8px', overflow: 'hidden', background: 'var(--bg-tertiary)', aspectRatio: '16/9', cursor: 'grab', outline: dragIdx === i ? '2px solid var(--accent)' : 'none', opacity: dragIdx === i ? .5 : 1 }}
                    >
                        <img src={f.image} alt={f.source} loading="lazy" onClick={() => onOpenFrame(f)} style={{ width: '100%', height: '100%', objectFit: 'cover', display: 'block', cursor: 'pointer' }} />
                        <div style={{ position: 'absolute', left: 0, right: 0, bottom: 0, padding: '22px 10px 8px', background: 'linear-gradient(transparent, rgba(0,0,0,.85))', pointerEvents: 'none' }}>
                            <div style={{ fontSize: '11px', fontWeight: 600, color: '#fff', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{f.source}</div>
                            <div style={{ fontSize: '10px', color: 'rgba(255,255,255,.6)' }}>{f.director}</div>
                        </div>
                        <button aria-label="Remove from board" onClick={() => removeFrame(active.id, f.id)} style={{ position: 'absolute', top: '8px', right: '8px', width: '28px', height: '28px', minWidth: 0, minHeight: 0, padding: 0, borderRadius: '6px', border: 'none', background: 'rgba(0,0,0,.7)', color: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer', opacity: hover || isMobile ? 1 : 0, transition: 'opacity .2s' }}>
                            <Icons.X />
                        </button>
                    </div>
                );
            };

            const btn = (extra = {}) => ({ display: 'inline-flex', alignItems: 'center', gap: '8px', padding: '9px 14px', background: 'var(--bg-tertiary)', color: 'var(--text-primary)', border: '1px solid var(--border)', borderRadius: '8px', fontSize: '12px', fontWeight: 600, cursor: 'pointer', ...extra });

            return (
                <div onClick={onClose} role="dialog" aria-modal="true" aria-label="My boards" style={{ position: 'fixed', inset: 0, zIndex: 220, background: 'rgba(0,0,0,.95)', display: 'flex', alignItems: 'flex-start', justifyContent: 'center', padding: isMobile ? '12px' : '40px', overflowY: 'auto', overscrollBehavior: 'contain', animation: 'fadeIn .25s ease-out' }}>
                    <div onClick={(e) => e.stopPropagation()} style={{ width: '100%', maxWidth: '1200px', background: 'var(--bg-secondary)', border: '1px solid var(--border)', borderRadius: '16px', animation: 'scaleIn .25s ease-out', margin: isMobile ? '52px 0 12px' : 'auto', minHeight: isMobile ? 'auto' : '60vh', display: 'flex', flexDirection: 'column' }}>
                        {/* Header */}
                        <div style={{ display: 'flex', alignItems: 'center', gap: '12px', padding: isMobile ? '16px' : '20px 24px', borderBottom: '1px solid var(--border)' }}>
                            {active && (
                                <button onClick={() => { setActiveId(null); setEditing(false); }} style={btn({ padding: '8px 12px' })}>← Boards</button>
                            )}
                            <div style={{ flex: 1, minWidth: 0 }}>
                                {active ? (
                                    editing ? (
                                        <input autoFocus value={nameDraft} onChange={(e) => setNameDraft(e.target.value)} maxLength={60}
                                            onKeyDown={(e) => { if (e.key === 'Enter') { renameBoard(active.id, nameDraft); setEditing(false); } if (e.key === 'Escape') setEditing(false); }}
                                            onBlur={() => { renameBoard(active.id, nameDraft); setEditing(false); }}
                                            style={{ width: '100%', fontSize: '20px', fontWeight: 600, background: 'var(--bg-tertiary)', border: '1px solid var(--accent)', borderRadius: '8px', color: 'var(--text-primary)', padding: '6px 10px', outline: 'none' }} />
                                    ) : (
                                        <h2 onClick={() => { setNameDraft(active.name); setEditing(true); }} title="Rename" style={{ fontSize: isMobile ? '18px' : '22px', fontWeight: 600, margin: 0, cursor: 'text', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                                            {active.name} <span style={{ fontSize: '12px', color: 'var(--text-tertiary)', fontFamily: "'JetBrains Mono', monospace", fontWeight: 400 }}>· {items.length} frame{items.length === 1 ? '' : 's'}</span>
                                        </h2>
                                    )
                                ) : (
                                    <h2 style={{ fontSize: isMobile ? '18px' : '22px', fontWeight: 600, margin: 0 }}>My Boards <span style={{ fontSize: '12px', color: 'var(--text-tertiary)', fontFamily: "'JetBrains Mono', monospace", fontWeight: 400 }}>· saved in this browser</span></h2>
                                )}
                            </div>
                            <button onClick={onClose} aria-label="Close" style={btn({ padding: '8px 10px' })}><Icons.X /></button>
                        </div>

                        {/* Body */}
                        <div style={{ padding: isMobile ? '16px' : '24px', flex: 1 }}>
                            {!active ? (
                                <>
                                    <div style={{ display: 'flex', gap: '8px', marginBottom: '20px', maxWidth: '460px' }}>
                                        <input value={newName} onChange={(e) => setNewName(e.target.value)} placeholder="New board name" maxLength={60}
                                            onKeyDown={(e) => { if (e.key === 'Enter' && newName.trim()) { const b = createBoard(newName); setNewName(''); setActiveId(b.id); } }}
                                            style={{ flex: 1, padding: '10px 14px', background: 'var(--bg-tertiary)', border: '1px solid var(--border)', borderRadius: '8px', color: 'var(--text-primary)', fontSize: '14px', outline: 'none' }} />
