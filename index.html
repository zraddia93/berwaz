                                        <button onClick={() => { if (newName.trim()) { const b = createBoard(newName); setNewName(''); setActiveId(b.id); } }} disabled={!newName.trim()} style={btn({ background: 'var(--accent)', color: '#000', border: 'none', opacity: newName.trim() ? 1 : .5 })}><Icons.Plus /> Create</button>
                                    </div>
                                    {boards.length === 0 ? (
                                        <div style={{ textAlign: 'center', padding: '56px 20px', color: 'var(--text-tertiary)', border: '1px dashed var(--border)', borderRadius: '12px' }}>
                                            <div style={{ display: 'flex', justifyContent: 'center', marginBottom: '12px', opacity: .5 }}><Icons.Bookmark size={36} /></div>
                                            <div style={{ fontSize: '15px', color: 'var(--text-secondary)' }}>No boards yet</div>
                                            <div style={{ fontSize: '13px', marginTop: '6px' }}>Hover any frame and press the bookmark to start a moodboard.</div>
                                        </div>
                                    ) : (
                                        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(min(240px, 100%), 1fr))', gap: '16px' }}>
                                            {boards.map(b => {
                                                const covers = b.frames.slice(0, 4).map(id => byId[id]).filter(Boolean);
                                                return (
                                                    <div key={b.id} role="button" tabIndex={0} onClick={() => setActiveId(b.id)} onKeyDown={(e) => { if (e.key === 'Enter') setActiveId(b.id); }}
                                                        style={{ borderRadius: '12px', overflow: 'hidden', background: 'var(--bg-tertiary)', border: '1px solid var(--border)', cursor: 'pointer', transition: 'border-color .2s' }}
                                                        onMouseEnter={(e) => e.currentTarget.style.borderColor = 'var(--accent)'} onMouseLeave={(e) => e.currentTarget.style.borderColor = 'var(--border)'}>
                                                        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gridTemplateRows: '1fr 1fr', gap: '2px', aspectRatio: '16/10', background: '#000' }}>
                                                            {[0, 1, 2, 3].map(i => covers[i]
                                                                ? <img key={i} src={covers[i].image} alt="" loading="lazy" style={{ width: '100%', height: '100%', objectFit: 'cover', display: 'block' }} />
                                                                : <div key={i} style={{ background: 'var(--bg-secondary)' }} />)}
                                                        </div>
                                                        <div style={{ padding: '12px 14px', display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: '10px' }}>
                                                            <div style={{ fontSize: '14px', fontWeight: 600, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{b.name}</div>
                                                            <span style={{ fontSize: '11px', color: 'var(--text-tertiary)', fontFamily: "'JetBrains Mono', monospace", flexShrink: 0 }}>{b.frames.length}</span>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    )}
                                </>
                            ) : (
                                <>
                                    <div style={{ display: 'flex', flexWrap: 'wrap', gap: '8px', marginBottom: '18px' }}>
                                        <button onClick={shareLink} disabled={!items.length} style={btn({ opacity: items.length ? 1 : .5 })}><Icons.Link /> Copy share link</button>
                                        <button onClick={exportImage} disabled={!items.length || busy === 'image'} style={btn({ opacity: items.length ? 1 : .5 })}><Icons.Image /> {busy === 'image' ? 'Rendering…' : 'Download as image'}</button>
                                        <button onClick={copyPrompts} disabled={!items.length} style={btn({ opacity: items.length ? 1 : .5 })}><Icons.Copy /> Copy all AI prompts</button>
                                        <span style={{ flex: 1 }} />
                                        <button onClick={() => { if (confirm(`Delete “${active.name}”?`)) { deleteBoard(active.id); setActiveId(null); onToast({ text: 'Board deleted' }); } }} style={btn({ color: '#ff7b7b' })}><Icons.Trash /> Delete</button>
                                    </div>
                                    {items.length === 0 ? (
                                        <div style={{ textAlign: 'center', padding: '56px 20px', color: 'var(--text-tertiary)', border: '1px dashed var(--border)', borderRadius: '12px' }}>
                                            <div style={{ fontSize: '14px', color: 'var(--text-secondary)' }}>This board is empty</div>
                                            <div style={{ fontSize: '13px', marginTop: '6px' }}>Close this and press the bookmark on any frame to add it here.</div>
                                        </div>
                                    ) : (
                                        <>
                                            {!isMobile && <div style={{ fontSize: '11px', color: 'var(--text-tertiary)', marginBottom: '10px' }}>Drag to reorder · click a frame to open it</div>}
                                            <div style={{ display: 'grid', gridTemplateColumns: `repeat(auto-fill, minmax(min(${isMobile ? 150 : 220}px, 100%), 1fr))`, gap: '12px' }}>
                                                {items.map((f, i) => <Tile key={f.id} f={f} i={i} />)}
                                            </div>
                                        </>
                                    )}
                                </>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        // Read-only view of a board opened from a share link
        const SharedBoardModal = ({ shared, frames, boardsApi, onClose, onOpenFrame, onToast, isMobile, escEnabled = true }) => {
            useModalChrome(onClose, escEnabled);
            const byId = useMemo(() => Object.fromEntries(frames.map(f => [f.id, f])), [frames]);
            const items = shared.frames.map(id => byId[id]).filter(Boolean);
            const save = () => { const b = boardsApi.createBoard(shared.name, items.map(f => f.id)); onToast({ text: `Saved “${b.name}” to your boards` }); onClose(); };
            return (
                <div onClick={onClose} role="dialog" aria-modal="true" style={{ position: 'fixed', inset: 0, zIndex: 220, background: 'rgba(0,0,0,.95)', display: 'flex', alignItems: 'flex-start', justifyContent: 'center', padding: isMobile ? '12px' : '40px', overflowY: 'auto', overscrollBehavior: 'contain', animation: 'fadeIn .25s ease-out' }}>
                    <div onClick={(e) => e.stopPropagation()} style={{ width: '100%', maxWidth: '1200px', background: 'var(--bg-secondary)', border: '1px solid var(--border)', borderRadius: '16px', margin: isMobile ? '52px 0 12px' : 'auto', animation: 'scaleIn .25s ease-out' }}>
                        <div style={{ padding: isMobile ? '16px' : '20px 24px', borderBottom: '1px solid var(--border)', display: 'flex', alignItems: 'center', gap: '12px', flexWrap: 'wrap' }}>
                            <div style={{ flex: 1, minWidth: '200px' }}>
                                <div style={{ fontSize: '10px', letterSpacing: '.15em', textTransform: 'uppercase', color: 'var(--accent)', marginBottom: '4px' }}>Shared board</div>
                                <h2 style={{ fontSize: isMobile ? '18px' : '22px', fontWeight: 600, margin: 0 }}>{shared.name} <span style={{ fontSize: '12px', color: 'var(--text-tertiary)', fontFamily: "'JetBrains Mono', monospace", fontWeight: 400 }}>· {items.length} frames</span></h2>
                            </div>
                            <button onClick={save} style={{ display: 'inline-flex', alignItems: 'center', gap: '8px', padding: '10px 16px', background: 'var(--accent)', color: '#000', border: 'none', borderRadius: '8px', fontSize: '13px', fontWeight: 600, cursor: 'pointer' }}><Icons.Bookmark filled size={14} /> Save to my boards</button>
                            <button onClick={onClose} aria-label="Close" style={{ padding: '8px 10px', background: 'var(--bg-tertiary)', color: 'var(--text-primary)', border: '1px solid var(--border)', borderRadius: '8px', cursor: 'pointer', display: 'flex' }}><Icons.X /></button>
                        </div>
                        <div style={{ padding: isMobile ? '16px' : '24px' }}>
                            {items.length === 0 ? (
                                <div style={{ textAlign: 'center', padding: '48px', color: 'var(--text-tertiary)' }}>None of the frames in this link are available anymore.</div>
                            ) : (
                                <div style={{ display: 'grid', gridTemplateColumns: `repeat(auto-fill, minmax(min(${isMobile ? 150 : 220}px, 100%), 1fr))`, gap: '12px' }}>
                                    {items.map(f => (
                                        <div key={f.id} onClick={() => onOpenFrame(f)} style={{ position: 'relative', borderRadius: '8px', overflow: 'hidden', aspectRatio: '16/9', background: 'var(--bg-tertiary)', cursor: 'pointer' }}>
                                            <img src={f.image} alt={f.source} loading="lazy" style={{ width: '100%', height: '100%', objectFit: 'cover', display: 'block' }} />
                                            <div style={{ position: 'absolute', left: 0, right: 0, bottom: 0, padding: '22px 10px 8px', background: 'linear-gradient(transparent, rgba(0,0,0,.85))' }}>
                                                <div style={{ fontSize: '11px', fontWeight: 600, color: '#fff', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{f.source}</div>
                                                <div style={{ fontSize: '10px', color: 'rgba(255,255,255,.6)' }}>{f.director}</div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        // Main App
        const App = () => {
            // Transform embedded data to include full image path and shuffle on load
            const [frames] = useState(() => {
                const data = (typeof FRAMES_DATA !== 'undefined') ? FRAMES_DATA : [];
                const processed = data.map(frame => ({
                    ...frame,
                    image: frame.file ? CONTENT_PATH + encodePath(frame.file) : frame.image
                }));
                return shuffleArray(processed);
            });
            const [searchQuery, setSearchQuery] = useState('');
            const [activeTags, setActiveTags] = useState([]);
            const [showFilters, setShowFilters] = useState(false);
            const [selectedFrame, setSelectedFrame] = useState(null);

            // Check URL params for director filter on load
            const [filterDirector, setFilterDirector] = useState(() => {
                const params = new URLSearchParams(window.location.search);
                return params.get('director') || null;
            });
            const [filterSource, setFilterSource] = useState(() => {
                const params = new URLSearchParams(window.location.search);
                return params.get('source') || null;
            });
            const [showAbout, setShowAbout] = useState(false);
            const [showFeatured, setShowFeatured] = useState(false);
            const [frameSize, setFrameSize] = useState('M');
            const [visibleCount, setVisibleCount] = useState(PAGE_SIZE);

            const isMobile = useMediaQuery('(max-width: 768px)');

            // Measure the real header + filter bar height so content never hides underneath
            const headerRef = useRef(null);
            const filterBarRef = useRef(null);
            const [headerH, setHeaderH] = useState(64);
            const [filterH, setFilterH] = useState(0);

            useEffect(() => {
                const measure = () => {
                    if (headerRef.current) setHeaderH(headerRef.current.getBoundingClientRect().height);
                    setFilterH(filterBarRef.current ? filterBarRef.current.getBoundingClientRect().height : 0);
                };
                measure();
                const ro = new ResizeObserver(measure);
                if (headerRef.current) ro.observe(headerRef.current);
                if (filterBarRef.current) ro.observe(filterBarRef.current);
                window.addEventListener('resize', measure);
                return () => { ro.disconnect(); window.removeEventListener('resize', measure); };
            }, [showFilters, isMobile]);

            // Any change to the result set should start the user at the top of it
            const resetView = useCallback(() => {
                setVisibleCount(PAGE_SIZE);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }, []);

            const toggleTag = useCallback((tag) => {
                setActiveTags(prev =>
                    prev.includes(tag) ? prev.filter(t => t !== tag) : [...prev, tag]
                );
                resetView();
            }, [resetView]);

            // Clearing also drops the ?director= param, so a refresh doesn't re-apply it
            const clearFilters = useCallback(() => {
                setActiveTags([]);
                setFilterDirector(null);
                setFilterSource(null);
                setSearchQuery('');
                if (window.location.search) {
                    window.history.replaceState(null, '', window.location.pathname);
                }
                resetView();
            }, [resetView]);

            const handleFilterByDirector = useCallback((director) => {
                setFilterDirector(director);
                setFilterSource(null);
                setSelectedFrame(null);
                resetView();
            }, [resetView]);

            const handleFilterBySource = useCallback((source) => {
                setFilterSource(source);
                setFilterDirector(null);
                setSelectedFrame(null);
                resetView();
            }, [resetView]);

            const handleFilterByTag = useCallback((tag) => {
                setSearchQuery(tag);
                setSelectedFrame(null);
                resetView();
            }, [resetView]);

            const handleCloseFrame = useCallback(() => setSelectedFrame(null), []);
            const handleCloseAbout = useCallback(() => setShowAbout(false), []);
            const handleCloseFeatured = useCallback(() => setShowFeatured(false), []);

            // ── Boards ──
            const boardsApi = useBoards();
            const [showBoards, setShowBoards] = useState(false);
            const [boardsInitialId, setBoardsInitialId] = useState(null);
            const [picker, setPicker] = useState(null);          // { frame, rect }
            const [toast, setToast] = useState(null);
            const toastTimer = useRef(null);
            const [sharedBoard, setSharedBoard] = useState(() => {
                const p = new URLSearchParams(window.location.search).get('board');
                return p ? decodeBoardLink(p) : null;
            });

            const showToast = useCallback((t) => {
                setToast(t);
                if (toastTimer.current) clearTimeout(toastTimer.current);
                toastTimer.current = setTimeout(() => setToast(null), 2800);
            }, []);
            useEffect(() => () => { if (toastTimer.current) clearTimeout(toastTimer.current); }, []);

            const savedSet = useMemo(() => new Set(boardsApi.boards.flatMap(b => b.frames)), [boardsApi.boards]);

            // One-tap save: if there is exactly one board and the frame isn't in it, save directly; otherwise open the picker
            const handleSave = useCallback((frame, rect) => {
                const { boards, toggleFrame, lastBoardId } = boardsApi;
                if (boards.length === 1 && !boards[0].frames.includes(frame.id)) {
                    toggleFrame(boards[0].id, frame.id);
                    showToast({ text: `Saved to “${boards[0].name}”`, action: { label: 'Change', onClick: () => { setToast(null); setPicker({ frame, rect: null }); } } });
                    return;
                }
                setPicker({ frame, rect: rect || null });
            }, [boardsApi, showToast]);

            const handlePickerDone = useCallback((t) => { setPicker(null); if (t) showToast(t); }, [showToast]);
            const openBoards = useCallback((id = null) => { setBoardsInitialId(id); setShowBoards(true); }, []);
            const handleCloseBoards = useCallback(() => setShowBoards(false), []);
            const handleCloseShared = useCallback(() => {
                setSharedBoard(null);
                if (window.location.search.includes('board=')) window.history.replaceState(null, '', window.location.pathname);
            }, []);

            // Filter frames
            const filteredFrames = useMemo(() => {
                let result = frames;

                // Filter by director
                if (filterDirector) {
                    const d = norm(filterDirector);
                    result = result.filter(f => norm(f.director) === d);
                }

                // Filter by source/project
                if (filterSource) {
                    const s = norm(filterSource);
                    result = result.filter(f => norm(f.source) === s);
                }

                if (searchQuery.trim()) {
                    const q = norm(searchQuery);
                    result = result.filter(f =>
                        norm(f.source).includes(q) ||
                        norm(f.sourceAr).includes(q) ||
                        norm(f.director).includes(q) ||
                        norm(f.title).includes(q) ||
                        norm(f.mood).includes(q) ||
                        norm(f.lighting).includes(q) ||
                        norm(f.prompt).includes(q) ||
                        (f.tags || []).some(t => norm(t).includes(q))
                    );
                }

                if (activeTags.length > 0) {
                    result = result.filter(f =>
                        activeTags.some(tag => {
                            // 1. Explicit assignment from the admin panel (Unicode-normalised)
                            if (f.source && PROJECT_CATEGORY_MAP[norm(f.source)] === tag) return true;
                            const tagLower = norm(tag);
                            // 2. Fallback: project name contains the category text
                            if (norm(f.source).includes(tagLower)) return true;
                            // 3. Fallback: frame tags contain the category text
                            if ((f.tags || []).some(t => norm(t).includes(tagLower))) return true;
                            return false;
                        })
                    );
                }

                return result;
            }, [frames, searchQuery, activeTags, filterDirector, filterSource]);

            // Reset paging whenever the result set changes size
            useEffect(() => { setVisibleCount(PAGE_SIZE); }, [searchQuery, activeTags, filterDirector, filterSource]);

            const visibleFrames = useMemo(
                () => filteredFrames.slice(0, visibleCount),
                [filteredFrames, visibleCount]
            );
            const hasMore = visibleCount < filteredFrames.length;

            // Infinite scroll: reveal the next page as the sentinel comes into view
            const sentinelRef = useRef(null);
            useEffect(() => {
                if (!hasMore || !sentinelRef.current) return;
                const io = new IntersectionObserver((entries) => {
                    if (entries.some(e => e.isIntersecting)) {
                        setVisibleCount(c => Math.min(c + PAGE_SIZE, filteredFrames.length));
                    }
                }, { rootMargin: '900px 0px' });
                io.observe(sentinelRef.current);
                return () => io.disconnect();
            }, [hasMore, filteredFrames.length]);

            return (
                <div style={{ minHeight: '100vh' }}>
                    <Header
                        headerRef={headerRef}
                        searchQuery={searchQuery}
                        setSearchQuery={setSearchQuery}
                        showFilters={showFilters}
                        setShowFilters={setShowFilters}
                        onShowAbout={() => setShowAbout(true)}
                        onShowFeatured={() => setShowFeatured(true)}
                        onShowBoards={() => openBoards()}
                        boardsCount={boardsApi.boards.length}
                        frameSize={frameSize}
                        setFrameSize={setFrameSize}
                    />

                    {showFilters && (
                        <FilterBar
                            activeTags={activeTags}
                            toggleTag={toggleTag}
                            clearFilters={clearFilters}
                            barRef={filterBarRef}
                            top={headerH}
                        />
                    )}

                    {/* Main Content — padding derived from measured chrome height */}
                    <main style={{
                        paddingTop: `${headerH + filterH + 24}px`,
                        transition: 'padding 0.25s ease'
                    }}>
                        {/* Filter Banners */}
                        {(filterDirector || filterSource) && (
                            <div style={{
                                maxWidth: '1800px',
                                margin: '0 auto 24px',
                                padding: '0 24px'
                            }}>
                                <div style={{
                                    display: 'flex',
                                    alignItems: 'center',
                                    justifyContent: 'space-between',
                                    padding: '16px 20px',
                                    background: 'var(--bg-secondary)',
                                    border: '1px solid var(--border)',
                                    borderRadius: '8px'
                                }}>
                                    <div style={{ display: 'flex', alignItems: 'center', gap: '12px' }}>
                                        {filterDirector && (
                                            <>
                                                <Icons.User />
                                                <span>Showing all frames by <strong style={{ color: 'var(--accent)' }}>{filterDirector}</strong></span>
                                            </>
                                        )}
                                        {filterSource && (
                                            <>
                                                <Icons.Film />
                                                <span>Showing all frames from <strong style={{ color: 'var(--accent)' }}>{filterSource}</strong></span>
                                            </>
                                        )}
                                    </div>
                                    <button
                                        onClick={clearFilters}
                                        style={{
                                            background: 'none',
                                            border: 'none',
                                            color: 'var(--text-secondary)',
                                            cursor: 'pointer',
                                            fontSize: '13px'
                                        }}
                                    >
                                        Clear
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* Results Count */}
                        <div style={{
                            maxWidth: '1800px',
                            margin: '0 auto',
                            padding: '0 24px 24px',
                            display: 'flex',
                            justifyContent: 'space-between',
                            alignItems: 'center'
                        }}>
                            <div style={{
                                fontSize: '13px',
                                color: 'var(--text-tertiary)'
                            }}>
                                {hasMore
                                    ? `Showing ${visibleFrames.length.toLocaleString()} of ${filteredFrames.length.toLocaleString()} frames`
                                    : `${filteredFrames.length.toLocaleString()} frame${filteredFrames.length === 1 ? '' : 's'}`}
                            </div>
                            <div style={{
                                fontSize: '11px',
                                color: 'var(--accent)',
                                display: 'flex',
                                alignItems: 'center',
                                gap: '6px',
                                opacity: 0.8
                            }}>
                                <Icons.Sparkle />
                                Search includes AI descriptions
                            </div>
                        </div>

                        {/* Masonry Grid */}
                        {filteredFrames.length > 0 && (
                            <div
                                className={`frame-grid frame-grid-${frameSize.toLowerCase()}`}
                                style={{
                                    maxWidth: '2200px',
                                    margin: '0 auto',
                                    padding: '0 32px 20px',
                                    transition: 'all 0.3s ease'
                                }}>
                                {visibleFrames.map((frame, index) => (
                                    <div key={frame.id} style={{ marginBottom: frameSize === 'S' ? '12px' : frameSize === 'L' ? '24px' : '16px', breakInside: 'avoid' }}>
                                        <FrameCard
                                            frame={frame}
                                            index={index}
                                            onClick={setSelectedFrame}
                                            isSaved={savedSet.has(frame.id)}
                                            onSave={handleSave}
                                        />
                                    </div>
                                ))}
                            </div>
                        )}

                        {/* Infinite-scroll sentinel + explicit fallback button */}
                        {hasMore && (
                            <div ref={sentinelRef} style={{ display: 'flex', justifyContent: 'center', padding: '0 24px 60px' }}>
                                <button
                                    onClick={() => setVisibleCount(c => Math.min(c + PAGE_SIZE, filteredFrames.length))}
                                    style={{
                                        padding: '12px 28px',
                                        background: 'var(--bg-secondary)',
                                        color: 'var(--text-secondary)',
                                        border: '1px solid var(--border)',
                                        borderRadius: '8px',
                                        fontSize: '13px',
                                        fontWeight: 500,
                                        cursor: 'pointer'
                                    }}
                                >
                                    Load more frames
                                </button>
                            </div>
                        )}

                        {/* Empty State */}
                        {filteredFrames.length === 0 && (
                            <div style={{
                                textAlign: 'center',
                                padding: '80px 24px',
                                color: 'var(--text-tertiary)'
                            }}>
                                <div style={{ fontSize: '48px', marginBottom: '16px', opacity: 0.3 }}>◇</div>
                                <div style={{ fontSize: '16px' }}>No frames found</div>
                                <div style={{ fontSize: '13px', marginTop: '8px' }}>Try adjusting your search or filters</div>
                            </div>
                        )}
                    </main>

                    {/* Frame Modal */}
                    {selectedFrame && (
                        <FrameModal
                            frame={selectedFrame}
                            isMobile={isMobile}
                            onClose={handleCloseFrame}
                            onFilterByDirector={handleFilterByDirector}
                            onFilterBySource={handleFilterBySource}
                            onFilterByTag={handleFilterByTag}
                            isSaved={savedSet.has(selectedFrame.id)}
                            onSave={handleSave}
                        />
                    )}

                    {/* Boards */}
                    {showBoards && (
                        <BoardsModal
                            onClose={handleCloseBoards}
                            boardsApi={boardsApi}
                            frames={frames}
                            initialBoardId={boardsInitialId}
                            onOpenFrame={(f) => setSelectedFrame(f)}
                            onToast={showToast}
                            isMobile={isMobile}
                            escEnabled={!selectedFrame && !picker}
                        />
                    )}
                    {sharedBoard && !showBoards && (
                        <SharedBoardModal
                            shared={sharedBoard}
                            frames={frames}
                            boardsApi={boardsApi}
                            onClose={handleCloseShared}
                            onOpenFrame={(f) => setSelectedFrame(f)}
                            onToast={showToast}
                            isMobile={isMobile}
                            escEnabled={!selectedFrame && !picker}
                        />
                    )}
                    {picker && (
                        <BoardPicker frame={picker.frame} boardsApi={boardsApi} onDone={handlePickerDone} anchorRect={isMobile ? null : picker.rect} />
                    )}
                    <Toast toast={toast} />

                    {/* About Modal */}
                    {showAbout && (
                        <AboutModal onClose={handleCloseAbout} isMobile={isMobile} />
                    )}

                    {/* Featured Visuals Modal */}
                    {showFeatured && (
                        <FeaturedModal
                            onClose={handleCloseFeatured}
                            isMobile={isMobile}
                            frames={frames}
                            onSelectFrame={setSelectedFrame}
                        />
                    )}

                    {/* Footer */}
                    <footer style={{
                        borderTop: '1px solid var(--border)',
                        padding: '40px 24px',
                        textAlign: 'center'
                    }}>
                        <div style={{
                            display: 'flex',
                            alignItems: 'center',
                            justifyContent: 'center',
                            gap: '12px',
                            marginBottom: '12px'
                        }}>
                            <svg width="40" height="40" viewBox="0 0 700 450" fill="none">
                                <path d="M78.5 226C28.5 196 0 176 0 176L580 125C580 125 620 145 620 165C620 185 580 205 580 205L78.5 226Z" fill="#ffd900"/>
                                <polygon points="600,100 640,130 620,165 580,135" fill="#ffd900"/>
                                <rect x="295" y="340" width="50" height="50" transform="rotate(45 320 365)" fill="#ffd900"/>
                            </svg>
                            <span style={{
                                fontSize: '20px',
                                fontWeight: 600,
                                fontFamily: "'HT Moshreq Pro', sans-serif",
                                color: 'var(--accent)'
                            }}>
                                برواز
                            </span>
                        </div>
                        <div style={{
                            fontSize: '12px',
                            color: 'var(--text-tertiary)',
                            opacity: 0.6
                        }}>
                            Cinematic Reference Library — a visual study archive of Saudi filmmaking.
                        </div>
                    </footer>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>

    <style>
        /* Frame Grid Sizes */
        .frame-grid-s {
            column-count: 4;
            column-gap: 12px;
        }
        .frame-grid-m {
            column-count: 3;
            column-gap: 18px;
        }
        .frame-grid-l {
            column-count: 2;
            column-gap: 24px;
        }

        /* Responsive - reduce columns on smaller screens */
        @media (max-width: 1400px) {
            .frame-grid-s { column-count: 3; }
            .frame-grid-m { column-count: 2; }
            .frame-grid-l { column-count: 2; }
        }
        @media (max-width: 900px) {
            .frame-grid-s { column-count: 2; }
            .frame-grid-m { column-count: 2; }
            .frame-grid-l { column-count: 1; }
        }
        @media (max-width: 600px) {
            .frame-grid-s { column-count: 2; column-gap: 8px; }
            .frame-grid-m { column-count: 2; column-gap: 8px; }
            .frame-grid-l { column-count: 1; column-gap: 8px; }
        }

        /* Mobile Header */
        @media (max-width: 768px) {
            .mobile-hide { display: none !important; }
            .mobile-menu-btn { display: flex !important; }
        }
        @media (min-width: 769px) {
            .mobile-menu-btn { display: none !important; }
        }

        /* Bookmark on cards: always visible where there is no hover (touch) */
        @media (hover: none) { .card-save { opacity: 1 !important; transform: none !important; } }
        .frame-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        .frame-card:focus-visible .card-save { opacity: 1; transform: none; }

        /* AI prompt collapsed preview (3 lines) */
        .prompt-clamp {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Modal sidebar scrollbar */
        .modal-sidebar-scroll { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
        .modal-sidebar-scroll::-webkit-scrollbar { width: 6px; }
        .modal-sidebar-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        .modal-sidebar-scroll::-webkit-scrollbar-track { background: transparent; }

        /* Mobile Modal */
        @media (max-width: 768px) {
            .modal-content {
                grid-template-columns: 1fr !important;
            }
        }

        /* Touch-friendly buttons */
        @media (max-width: 768px) {
            button, a {
                min-height: 44px;
                min-width: 44px;
            }
        }
    </style>
</body>
</html>
