<!DOCTYPE html>
<html lang="en">
<head>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>

    <style>
        /* Custom Arabic Font */
        @font-face {
            font-family: 'HT Moshreq Pro';
            src: url('HTMoshreqPro-Regular.otf') format('opentype');
            font-weight: 400;
            font-style: normal;
        }
        @font-face {
            font-family: 'HT Moshreq Pro';
            src: url('HTMoshreqPro-Bold.otf') format('opentype');
            font-weight: 700;
            font-style: normal;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #000000;
            --bg-secondary: #0a0a0a;
            --bg-tertiary: #111111;
            --bg-elevated: #161616;
            --text-primary: #ffd900;
            --text-secondary: #cca800;
            --text-tertiary: #997e00;
            --accent: #ffd900;
            --accent-dim: rgba(255,217,0,0.1);
            --border: rgba(255,217,0,0.12);
            --border-hover: rgba(255,217,0,0.25);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }

        /* Improve touch scrolling on mobile */
        * {
            -webkit-tap-highlight-color: transparent;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--text-tertiary); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-secondary); }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .fade-in { animation: fadeIn 0.5s ease-out; }
        .slide-up { animation: slideUp 0.6s ease-out; }
        .scale-in { animation: scaleIn 0.3s ease-out; }

        /* Typography */
        .font-arabic { font-family: 'HT Moshreq Pro', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .text-xs { font-size: 11px; letter-spacing: 0.05em; }
        .text-sm { font-size: 13px; }
        .text-base { font-size: 15px; }
        .text-lg { font-size: 18px; }
        .text-xl { font-size: 24px; }
        .text-2xl { font-size: 32px; }
        .text-3xl { font-size: 48px; }
        .uppercase { text-transform: uppercase; }
        .tracking-wide { letter-spacing: 0.1em; }
        .tracking-wider { letter-spacing: 0.2em; }

        /* Utility Classes */
        .flex { display: flex; }
        .items-center { align-items: center; }
        .justify-between { justify-content: space-between; }
        .justify-center { justify-content: center; }
        .gap-1 { gap: 4px; }
        .gap-2 { gap: 8px; }
        .gap-3 { gap: 12px; }
        .gap-4 { gap: 16px; }
        .gap-6 { gap: 24px; }

        /* Shimmer Loading */
        .shimmer {
            background: linear-gradient(90deg, var(--bg-tertiary) 0%, var(--bg-elevated) 50%, var(--bg-tertiary) 100%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <!-- Password Gate -->
    <div id="password-gate" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#0a0a0a;z-index:99999;display:flex;align-items:center;justify-content:center;flex-direction:column;font-family:'Space Grotesk',sans-serif;">
        <img src="brand_mark.png" alt="Berwaz" style="width:80px;margin-bottom:32px;opacity:0.8;">
        <form id="password-form" style="display:flex;flex-direction:column;align-items:center;gap:16px;">
            <input id="password-input" type="password" placeholder="Enter password" autocomplete="off" style="background:#1a1a1a;border:1px solid #333;color:#fff;padding:12px 24px;border-radius:8px;font-size:16px;width:260px;text-align:center;outline:none;font-family:'Space Grotesk',sans-serif;" onfocus="this.style.borderColor='#D4A853'" onblur="this.style.borderColor='#333'">
            <button type="submit" style="background:#D4A853;color:#0a0a0a;border:none;padding:10px 32px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;font-family:'Space Grotesk',sans-serif;">Enter</button>
            <p id="password-error" style="color:#ff4444;font-size:13px;margin:0;display:none;">Incorrect password</p>
        </form>
    </div>
    <script>
        (function() {
            if (sessionStorage.getItem('berwaz_auth') === 'true') {
                document.getElementById('password-gate').style.display = 'none';
                return;
            }
            document.getElementById('root').style.display = 'none';
            document.getElementById('password-form').addEventListener('submit', function(e) {
                e.preventDefault();
                if (document.getElementById('password-input').value === 'berwaz93') {
                    sessionStorage.setItem('berwaz_auth', 'true');
                    document.getElementById('password-gate').style.display = 'none';
                    document.getElementById('root').style.display = '';
                } else {
                    document.getElementById('password-error').style.display = 'block';
                    document.getElementById('password-input').value = '';
                }
            });
        })();
    </script>

    <div id="root"></div>

         *     "id": "1",                   // Unique identifier
         *     "title": "Frame Title",       // Display title

         *     "year": 2024,                 // Year
         *     "director": "Director Name",  // Director
         *     "dp": "DP Name",              // Cinematographer
         *     "tags": ["tag1", "tag2"],     // Searchable tags
         *     "mood": "Mood",               // e.g., "Mysterious", "Epic"
         *     "lighting": "Lighting Type",  // e.g., "Natural", "Neon"
         *     "color": ["#hex1", "#hex2"],  // Color palette (3-4 colors)
         *     "aspect": "2.39:1",           // Aspect ratio
         *     "file": "your-file.jpg"       // Filename in content/ folder

                // Use 8-hour period as seed for consistent selection
                const now = new Date();
                const hoursSinceEpoch = Math.floor(now.getTime() / (1000 * 60 * 60));
                const periodSeed = Math.floor(hoursSinceEpoch / 8); // Changes every 8 hours

                // Seeded random function
                const seededRandom = (seed) => {
                    const x = Math.sin(seed) * 10000;
                    return x - Math.floor(x);
                };

                const shuffled = [...frames].map((frame, i) => ({

                        }}>
                            {featuredFrames.map((frame, index) => (
                                <div
                                    key={frame.id}
                                    onClick={() => {
                                        onSelectFrame(frame);
                                        onClose();
                                    }}
                                    style={{
                                        position: 'relative',
                                        aspectRatio: '16/9',
                                        borderRadius: '12px',
                                        overflow: 'hidden',
                                        cursor: 'pointer',
                                        transition: 'transform 0.3s, box-shadow 0.3s'
                                    }}
                                    onMouseEnter={(e) => {
                                        e.currentTarget.style.transform = 'scale(1.02)';
                                        e.currentTarget.style.boxShadow = '0 10px 40px rgba(255,217,0,0.2)';
                                    }}
                                    onMouseLeave={(e) => {
                                        e.currentTarget.style.transform = 'scale(1)';
                                        e.currentTarget.style.boxShadow = 'none';
                                    }}
                                >
                                    <img
                                        src={frame.image}
                                        alt={frame.title}
                                        loading="lazy"
                                        style={{
                                            width: '100%',
                                            height: '100%',
                                            objectFit: 'cover'
                                        }}
                                    />
                                </div>
                            ))}
                        </div>

                        <div style={{ textAlign: 'center', marginTop: '24px' }}>
                            <button
                                onClick={onClose}
                                style={{
                                    padding: '10px 28px',
                                    background: 'var(--accent)',
                                    color: 'var(--bg-primary)',
                                    border: 'none',
                                    borderRadius: '8px',
                                    fontSize: '14px',
                                    fontWeight: 600,
                                    cursor: 'pointer',
                                    transition: 'all 0.2s'
                                }}
                            >
                                Close
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // Main App
        const App = () => {
            // Transform embedded data to include full image path and shuffle on load
            const [frames] = useState(() => {
                const processed = FRAMES_DATA.map(frame => ({
                    ...frame,
                    image: frame.file ? CONTENT_PATH + encodeURI(frame.file) : frame.image
                }));
                return shuffleArray(processed);
            });
            const [searchQuery, setSearchQuery] = useState('');
            const [activeTags, setActiveTags] = useState([]);
            const [showFilters, setShowFilters] = useState(false);
            const [selectedFrame, setSelectedFrame] = useState(null);

            // Check URL params for director filter on load
            const [filterDirector, setFilterDirector] = useState(() => {
                const params = new URLSearchParams(window.location.search);
                return params.get('director') || null;
            });
            const [filterSource, setFilterSource] = useState(null);
            const [showAbout, setShowAbout] = useState(false);
            const [showFeatured, setShowFeatured] = useState(false);
            const [frameSize, setFrameSize] = useState('M');

            const toggleTag = useCallback((tag) => {
                setActiveTags(prev =>
                    prev.includes(tag) ? prev.filter(t => t !== tag) : [...prev, tag]
                );
            }, []);

            const clearFilters = useCallback(() => {
                setActiveTags([]);
                setFilterDirector(null);
                setFilterSource(null);
            }, []);

            const handleFilterByDirector = useCallback((director) => {
                setFilterDirector(director);
                setFilterSource(null);
                setSelectedFrame(null);
            }, []);

            const handleFilterBySource = useCallback((source) => {
                setFilterSource(source);
                setFilterDirector(null);
                setSelectedFrame(null);
            }, []);

            const handleFilterByTag = useCallback((tag) => {
                setSearchQuery(tag);
                setSelectedFrame(null);
            }, []);

            // Filter frames
            const filteredFrames = useMemo(() => {
                let result = frames;

                // Filter by director
                if (filterDirector) {
                    result = result.filter(f => f.director === filterDirector);
                }

                // Filter by source/project
                if (filterSource) {
                    result = result.filter(f => f.source === filterSource);
                }

                if (searchQuery.trim()) {
                    const q = searchQuery.toLowerCase();
                    result = result.filter(f =>
                        f.title.toLowerCase().includes(q) ||
                        f.source.toLowerCase().includes(q) ||
                        f.director.toLowerCase().includes(q) ||
                        f.tags.some(t => t.toLowerCase().includes(q))
                    );
                }

                if (activeTags.length > 0) {
                    result = result.filter(f =>
                        activeTags.some(tag => {
                            const tagLower = tag.toLowerCase();
                            // Match project types against source field
                            if (f.source && f.source.toLowerCase().includes(tagLower)) return true;
                            // Also check tags array for flexibility
                            if (f.tags && f.tags.some(t => t.toLowerCase().includes(tagLower))) return true;
                            return false;
                        })
                    );
                }

                return result;
            }, [frames, searchQuery, activeTags, filterDirector, filterSource]);

            return (
                <div style={{ minHeight: '100vh' }}>
                    <Header
                        searchQuery={searchQuery}
                        setSearchQuery={setSearchQuery}
                        onSearch={() => {}}
                        showFilters={showFilters}
                        setShowFilters={setShowFilters}
                        onFilterByDirector={handleFilterByDirector}
                        onShowAbout={() => setShowAbout(true)}
                        onShowFeatured={() => setShowFeatured(true)}
                        frameSize={frameSize}
                        setFrameSize={setFrameSize}
                    />

                    {showFilters && (
                        <FilterBar
                            activeTags={activeTags}
                            toggleTag={toggleTag}
                            clearFilters={clearFilters}
                        />
                    )}

                    {/* Main Content */}
                    <main style={{
                        paddingTop: showFilters ? '250px' : '105px',
                        transition: 'padding 0.3s'
                    }}>
                        {/* Filter Banners */}
                        {(filterDirector || filterSource) && (
                            <div style={{
                                maxWidth: '1800px',
                                margin: '0 auto 24px',
                                padding: '0 24px'
                            }}>
                                <div style={{
                                    display: 'flex',
                                    alignItems: 'center',
                                    justifyContent: 'space-between',
                                    padding: '16px 20px',
                                    background: 'var(--bg-secondary)',
                                    border: '1px solid var(--border)',
                                    borderRadius: '8px'
                                }}>
                                    <div style={{ display: 'flex', alignItems: 'center', gap: '12px' }}>
                                        {filterDirector && (
                                            <>
                                                <Icons.User />
                                                <span>Showing all frames by <strong style={{ color: 'var(--accent)' }}>{filterDirector}</strong></span>
                                            </>
                                        )}
                                        {filterSource && (
                                            <>
                                                <Icons.Film />
                                                <span>Showing all frames from <strong style={{ color: 'var(--accent)' }}>{filterSource}</strong></span>
                                            </>
                                        )}
                                    </div>
                                    <button
                                        onClick={clearFilters}
                                        style={{
                                            background: 'none',
                                            border: 'none',
                                            color: 'var(--text-secondary)',
                                            cursor: 'pointer',
                                            fontSize: '13px'
                                        }}
                                    >
                                        Clear
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* Results Count */}
                        <div style={{
                            maxWidth: '1800px',
                            margin: '0 auto',
                            padding: '0 24px 24px',
                            display: 'flex',
                            justifyContent: 'space-between',
                            alignItems: 'center'
                        }}>
                            <div style={{
                                fontSize: '13px',
                                color: 'var(--text-tertiary)'
                            }}>
                                {filteredFrames.length} frames
                            </div>
                            <div style={{
                                fontSize: '11px',
                                color: 'var(--accent)',
                                display: 'flex',
                                alignItems: 'center',
                                gap: '6px',
                                opacity: 0.8
                            }}>
                                <Icons.Sparkle />
                                AI-powered search
                            </div>
                        </div>

                        {/* Masonry Grid */}
                        {filteredFrames.length > 0 && (
                            <div
                                className={`frame-grid frame-grid-${frameSize.toLowerCase()}`}
                                style={{
                                    maxWidth: '2200px',
                                    margin: '0 auto',
                                    padding: '0 32px 60px',
                                    transition: 'all 0.3s ease'
                                }}>
                                {filteredFrames.map((frame, index) => (
                                    <div key={frame.id} style={{ marginBottom: frameSize === 'S' ? '12px' : frameSize === 'L' ? '24px' : '16px', breakInside: 'avoid' }}>
                                        <FrameCard
                                            frame={frame}
                                            index={index}
                                            onClick={setSelectedFrame}
                                            size={frameSize}
                                        />
                                    </div>
                                ))}
                            </div>
                        )}

                        {/* Empty State */}
                        {filteredFrames.length === 0 && (
                            <div style={{
                                textAlign: 'center',
                                padding: '80px 24px',
                                color: 'var(--text-tertiary)'
                            }}>
                                <div style={{ fontSize: '48px', marginBottom: '16px', opacity: 0.3 }}>◇</div>
                                <div style={{ fontSize: '16px' }}>No frames found</div>
                                <div style={{ fontSize: '13px', marginTop: '8px' }}>Try adjusting your search or filters</div>
                            </div>
                        )}
                    </main>

                    {/* Frame Modal */}
                    {selectedFrame && (
                        <FrameModal
                            frame={selectedFrame}
                            onClose={() => setSelectedFrame(null)}
                            onFilterByDirector={handleFilterByDirector}
                            onFilterBySource={handleFilterBySource}
                            onFilterByTag={handleFilterByTag}
                        />
                    )}

                    {/* About Modal */}
                    {showAbout && (
                        <AboutModal onClose={() => setShowAbout(false)} />
                    )}

                    {/* Featured Visuals Modal */}
                    {showFeatured && (
                        <FeaturedModal
                            onClose={() => setShowFeatured(false)}
                            frames={frames}
                            onSelectFrame={setSelectedFrame}
                        />
                    )}

                    {/* Footer */}
                    <footer style={{
                        borderTop: '1px solid var(--border)',
                        padding: '40px 24px',
                        textAlign: 'center'
                    }}>
                        <div style={{
                            display: 'flex',
                            alignItems: 'center',
                            justifyContent: 'center',
                            gap: '12px',
                            marginBottom: '12px'
                        }}>
                            <svg width="40" height="40" viewBox="0 0 700 450" fill="none">
                                <path d="M78.5 226C28.5 196 0 176 0 176L580 125C580 125 620 145 620 165C620 185 580 205 580 205L78.5 226Z" fill="#ffd900"/>
                                <polygon points="600,100 640,130 620,165 580,135" fill="#ffd900"/>
                                <rect x="295" y="340" width="50" height="50" transform="rotate(45 320 365)" fill="#ffd900"/>
                            </svg>
                            <span style={{
                                fontSize: '20px',
                                fontWeight: 600,
                                fontFamily: "'HT Moshreq Pro', sans-serif",
                                color: 'var(--accent)'
                            }}>
                                برواز
                            </span>
                        </div>
                        <div style={{
                            fontSize: '12px',
                            color: 'var(--text-tertiary)',
                            opacity: 0.6
                        }}>
                            Cinematic Reference Library — Free and open. No signup required.
                        </div>
                    </footer>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>

    <style>
        /* Frame Grid Sizes */
        .frame-grid-s {
            column-count: 4;
            column-gap: 12px;
        }
        .frame-grid-m {
            column-count: 3;
            column-gap: 18px;
        }
        .frame-grid-l {
            column-count: 2;
            column-gap: 24px;
        }

        /* Responsive - reduce columns on smaller screens */
        @media (max-width: 1400px) {
            .frame-grid-s { column-count: 3; }
            .frame-grid-m { column-count: 2; }
            .frame-grid-l { column-count: 2; }
        }
        @media (max-width: 900px) {
            .frame-grid-s { column-count: 2; }
            .frame-grid-m { column-count: 2; }
            .frame-grid-l { column-count: 1; }
        }
        @media (max-width: 600px) {
            .frame-grid-s { column-count: 2; column-gap: 8px; }
            .frame-grid-m { column-count: 2; column-gap: 8px; }
            .frame-grid-l { column-count: 1; column-gap: 8px; }
        }

        /* Mobile Header */
        @media (max-width: 768px) {
            .mobile-hide { display: none !important; }
            .mobile-menu-btn { display: flex !important; }
        }
        @media (min-width: 769px) {
            .mobile-menu-btn { display: none !important; }
        }

        /* Mobile Modal */
        @media (max-width: 768px) {
            .modal-content {
                grid-template-columns: 1fr !important;
                max-height: 90vh;
                overflow-y: auto;
            }
            .modal-sidebar {
                max-height: none !important;
                overflow-y: visible !important;
            }
        }

        /* Touch-friendly buttons */
        @media (max-width: 768px) {
            button, a {
                min-height: 44px;
                min-width: 44px;
            }
        }
    </style>
</body>
</html>
