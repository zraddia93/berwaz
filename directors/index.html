<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta name="theme-color" content="#0a0a0a">
    <title>Directors - برواز</title>
    <link rel="icon" type="image/png" href="brand_mark.png">
    <link rel="preconnect" href="https://pub-b8befece66bc4203bab663b2ed292cd4.r2.dev" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.9/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'HT Moshreq Pro';
            src: url('../HTMoshreqPro-Bold.otf') format('opentype');
            font-weight: 700;
        }
        @font-face {
            font-family: 'HT Moshreq Pro';
            src: url('../HTMoshreqPro-Regular.otf') format('opentype');
            font-weight: 400;
        }

        :root {
            --bg-primary: #000000;
            --bg-secondary: #0a0a0a;
            --bg-tertiary: #111111;
            --bg-elevated: #161616;
            --text-primary: #ffd900;
            --text-secondary: #cca800;
            --text-tertiary: #997e00;
            --accent: #ffd900;
            --accent-hover: #e6c300;
            --border: rgba(255, 217, 0, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            overflow-x: hidden;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-secondary); }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

        .shimmer { background: linear-gradient(90deg, #141414 25%, #1e1e1e 50%, #141414 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        @media (max-width: 720px) {
            .profile-hero-grid { grid-template-columns: 1fr !important; }
        }
    </style>
</head>
<body>
    <!-- Password Gate -->
    <div id="password-gate" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#0a0a0a;z-index:99999;display:flex;align-items:center;justify-content:center;flex-direction:column;font-family:'Space Grotesk',sans-serif;">
        <img src="brand_mark.png" alt="Berwaz" style="width:80px;margin-bottom:32px;opacity:0.8;">
        <p style="color:#888;font-size:14px;letter-spacing:2px;text-transform:uppercase;margin:0 0 8px 0;">Work in Progress</p>
        <p style="color:#555;font-size:13px;margin:0 0 32px 0;">This platform is currently under development. Coming soon.</p>
        <form id="password-form" style="display:flex;flex-direction:column;align-items:center;gap:16px;">
            <input id="password-input" type="password" placeholder="Enter password" autocomplete="off" style="background:#1a1a1a;border:1px solid #333;color:#fff;padding:12px 24px;border-radius:8px;font-size:16px;width:260px;text-align:center;outline:none;font-family:'Space Grotesk',sans-serif;" onfocus="this.style.borderColor='#ffd900'" onblur="this.style.borderColor='#333'">
            <button type="submit" style="background:#ffd900;color:#0a0a0a;border:none;padding:10px 32px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;font-family:'Space Grotesk',sans-serif;">Enter</button>
            <p id="password-error" style="color:#ff4444;font-size:13px;margin:0;display:none;">Incorrect password</p>
        </form>
    </div>

    <div id="root" style="display:none;"></div>

    <script>
        (function() {
            if (sessionStorage.getItem('berwaz_auth') === 'true') {
                document.getElementById('password-gate').style.display = 'none';
                document.getElementById('root').style.display = '';
            }
            document.getElementById('password-form').addEventListener('submit', function(e) {
                e.preventDefault();
                if (document.getElementById('password-input').value === 'berwaz93') {
                    sessionStorage.setItem('berwaz_auth', 'true');
                    document.getElementById('password-gate').style.display = 'none';
                    document.getElementById('root').style.display = '';
                } else {
                    document.getElementById('password-error').style.display = 'block';
                    document.getElementById('password-input').value = '';
                }
            });
        })();
    </script>

                vimeo: "",

            },
            {

                nameAr: "محمد السليمان",
                bio: "Mohammad Alsuliman is a Saudi filmmaker and director.",

                instagram: "",

            }
        ];

        const encodePath = (p) => String(p).split('/').map(encodeURIComponent).join('/');
        const CONTENT_PATH = 'https://pub-b8befece66bc4203bab663b2ed292cd4.r2.dev/content/';

        // Get director from URL hash
        const getDirectorFromHash = () => {
            const hash = window.location.hash.slice(1);
            return DIRECTORS_DATA.find(d => d.id === hash);
        };

        // Header Component
        const Header = ({ onBack }) => (
            <header style={{
                position: 'sticky',
                top: 0,
                zIndex: 100,
                background: 'rgba(0,0,0,0.9)',
                backdropFilter: 'blur(20px)',
                borderBottom: '1px solid var(--border)',
                padding: '14px 20px',
                display: 'flex',
                alignItems: 'center',
                justifyContent: 'space-between',
                flexWrap: 'wrap',
                gap: '12px',
                direction: 'rtl'
            }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: '24px' }}>
                    <a href="../index.html" title="Back to the library" style={{ display: 'flex', alignItems: 'center', gap: '12px', textDecoration: 'none' }}>
                        <svg width="50" height="32" viewBox="0 0 700 450" fill="none">
                            <path d="M78.5 226C28.5 196 0 176 0 176L580 125C580 125 620 145 620 165C620 185 580 205 580 205L78.5 226Z" fill="#ffd900"/>
                            <polygon points="600,100 640,130 620,165 580,135" fill="#ffd900"/>
                            <rect x="295" y="340" width="50" height="50" transform="rotate(45 320 365)" fill="#ffd900"/>
                        </svg>
                        <span style={{
                            fontFamily: "'HT Moshreq Pro', sans-serif",
                            fontSize: '24px',
                            fontWeight: 700,
                            color: 'var(--accent)'
                        }}>برواز</span>
                    </a>
                </div>

                <div style={{ display: 'flex', alignItems: 'center', gap: '12px' }}>
                    {onBack && (
                        <button
                            onClick={onBack}
                            style={{
                                display: 'flex',
                                alignItems: 'center',
                                gap: '8px',
                                padding: '10px 20px',
                                background: 'transparent',
                                border: '1px solid var(--border)',
                                borderRadius: '8px',
                                color: 'var(--text-secondary)',
                                cursor: 'pointer',
                                fontSize: '14px',
                                transition: 'all 0.2s'
                            }}
                        >
                            ← Back to Directors
                        </button>
                    )}
                </div>
            </header>
        );

// ─── Data helpers ────────────────────────────────────────────────
        const ALL_FRAMES = (typeof FRAMES_DATA !== 'undefined') ? FRAMES_DATA : [];
        const frameUrl = (f) => CONTENT_PATH + encodePath(f.file);

        // Group a director's frames by project, largest project first
        const worksFor = (name) => {
            const map = {};
            ALL_FRAMES.filter(f => f.director === name).forEach(f => {
                (map[f.source] ||= { title: f.source, year: f.year, frames: [] }).frames.push(f);
            });
            return Object.values(map).sort((a, b) => b.frames.length - a.frames.length || b.year - a.year);
        };

        // A representative frame: 2nd frame of the biggest project (skips opening title cards)
        const coverFor = (works) => {
            if (!works.length) return null;
            const fr = works[0].frames;
            return fr[Math.min(1, fr.length - 1)];
        };

        const DIRECTOR_STATS = DIRECTORS_DATA.map(d => {
            const works = worksFor(d.name);
            const frames = works.reduce((n, w) => n + w.frames.length, 0);
            return { ...d, works, frames, projects: works.length, cover: coverFor(works) };
        });

        // Shared: lazy image with shimmer + graceful failure
        const Cover = ({ frame, alt, style }) => {
            const [ok, setOk] = useState(null); // null loading | true | false
            if (!frame) return <div style={{ ...style, background: 'var(--bg-tertiary)' }} />;
            return (
                <div style={{ position: 'relative', overflow: 'hidden', background: 'var(--bg-tertiary)', ...style }}>
                    {ok === null && <div className="shimmer" style={{ position: 'absolute', inset: 0 }} />}
                    {ok !== false && (
                        <img
                            src={frameUrl(frame)}
                            alt={alt || ''}
                            loading="lazy"
                            decoding="async"
                            onLoad={() => setOk(true)}
                            onError={() => setOk(false)}
                            style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', objectFit: 'cover', opacity: ok ? 1 : 0, transition: 'opacity .4s' }}
                        />
                    )}
                </div>
            );
        };

        // ─── Directors List ──────────────────────────────────────────────
        const DirectorsList = ({ onSelectDirector }) => {
            const active = DIRECTOR_STATS.filter(d => d.frames > 0).sort((a, b) => b.frames - a.frames);
            const upcoming = DIRECTOR_STATS.filter(d => d.frames === 0);
            const totalFrames = ALL_FRAMES.length;
            const totalProjects = new Set(ALL_FRAMES.map(f => f.source)).size;

            const Card = ({ d }) => {
                const [hover, setHover] = useState(false);
                const live = d.frames > 0;
                return (
                    <div
                        role="button"
                        tabIndex={0}
                        onClick={() => onSelectDirector(d)}
                        onKeyDown={(e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onSelectDirector(d); } }}
                        onMouseEnter={() => setHover(true)}
                        onMouseLeave={() => setHover(false)}
                        className="dir-card"
                        style={{
                            position: 'relative',
                            aspectRatio: '16 / 10',
                            borderRadius: '14px',
                            overflow: 'hidden',
                            cursor: 'pointer',
                            background: 'var(--bg-secondary)',
                            border: `1px solid ${hover ? 'var(--accent)' : 'var(--border)'}`,
                            transform: hover ? 'translateY(-3px)' : 'none',
                            boxShadow: hover ? '0 24px 60px rgba(0,0,0,.6)' : '0 8px 30px rgba(0,0,0,.35)',
                            transition: 'transform .35s cubic-bezier(.16,1,.3,1), box-shadow .35s, border-color .25s',
                            outline: 'none'
                        }}
                    >
                        {live ? (
                            <div style={{ position: 'absolute', inset: 0, transform: hover ? 'scale(1.04)' : 'scale(1)', transition: 'transform .8s cubic-bezier(.16,1,.3,1)' }}>
                                <Cover frame={d.cover} alt={d.name} style={{ position: 'absolute', inset: 0 }} />
                            </div>
                        ) : (
                            <div style={{
                                position: 'absolute', inset: 0,
                                display: 'flex', alignItems: 'center', justifyContent: 'center',
                                background: 'radial-gradient(ellipse at 50% 40%, #1c1c1c 0%, #0d0d0d 70%)'
                            }}>
                                <span style={{ fontSize: '88px', fontWeight: 700, color: 'rgba(255,217,0,.12)', letterSpacing: '-.04em', fontFamily: "'Space Grotesk', sans-serif" }}>
                                    {d.name.split(' ').map(w => w[0]).join('').slice(0, 2)}
                                </span>
                            </div>
                        )}

                        {/* Gradient scrim */}
                        <div style={{ position: 'absolute', inset: 0, background: 'linear-gradient(180deg, rgba(0,0,0,.05) 30%, rgba(0,0,0,.55) 65%, rgba(0,0,0,.92) 100%)' }} />

                        {/* Status chip */}
                        <div style={{
                            position: 'absolute', top: '14px', left: '14px',
                            padding: '5px 10px', borderRadius: '100px',
                            fontSize: '10px', fontWeight: 600, letterSpacing: '.12em', textTransform: 'uppercase',
                            background: live ? 'rgba(0,0,0,.65)' : 'rgba(255,255,255,.06)',
                            color: live ? 'var(--accent)' : 'var(--text-tertiary)',
                            border: `1px solid ${live ? 'rgba(255,217,0,.35)' : 'var(--border)'}`,
                            backdropFilter: 'blur(8px)'
                        }}>
                            {live ? `${d.projects} project${d.projects === 1 ? '' : 's'}` : 'Coming soon'}
                        </div>

                        {/* Names + stats */}
                        <div style={{ position: 'absolute', left: '20px', right: '20px', bottom: '18px', direction: 'rtl', textAlign: 'right' }}>
                            <div style={{ fontFamily: "'HT Moshreq Pro', sans-serif", fontSize: '30px', lineHeight: 1.1, color: '#fff', textShadow: '0 2px 12px rgba(0,0,0,.6)' }}>
                                {d.nameAr}
                            </div>
                            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginTop: '6px', direction: 'ltr' }}>
                                <span style={{ fontSize: '13px', color: 'rgba(255,255,255,.75)', letterSpacing: '.01em' }}>{d.name}</span>
                                {live && (
                                    <span style={{ fontSize: '12px', fontFamily: "'JetBrains Mono', monospace", color: 'var(--accent)' }}>
                                        {d.frames.toLocaleString()} frames
                                    </span>
                                )}
                            </div>
                        </div>
                    </div>
                );
            };

            return (
                <div>
                    {/* Editorial hero */}
                    <section style={{ padding: '72px 32px 40px', maxWidth: '1400px', margin: '0 auto' }}>
                        <div style={{ fontSize: '11px', letterSpacing: '.22em', textTransform: 'uppercase', color: 'var(--text-tertiary)', marginBottom: '18px' }}>
                            Berwaz · Cinematic Reference Library
                        </div>
                        <div style={{ display: 'flex', flexWrap: 'wrap', alignItems: 'flex-end', justifyContent: 'space-between', gap: '24px' }}>
                            <div>
                                <h1 style={{ fontFamily: "'HT Moshreq Pro', sans-serif", fontSize: 'clamp(48px, 7vw, 84px)', lineHeight: .95, color: 'var(--accent)', margin: 0 }}>
                                    المخرجين
                                </h1>
                                <div style={{ fontSize: 'clamp(20px, 2.4vw, 28px)', fontWeight: 300, color: 'var(--text-primary)', marginTop: '10px', letterSpacing: '-.01em' }}>
                                    The Saudi directors behind the frames
                                </div>
                            </div>
                            <div style={{ display: 'flex', gap: '36px' }}>
                                {[[DIRECTORS_DATA.length, 'Directors'], [totalProjects, 'Projects'], [totalFrames.toLocaleString(), 'Frames']].map(([n, l]) => (
                                    <div key={l}>
                                        <div style={{ fontSize: '30px', fontWeight: 700, color: 'var(--text-primary)', lineHeight: 1 }}>{n}</div>
                                        <div style={{ fontSize: '11px', letterSpacing: '.14em', textTransform: 'uppercase', color: 'var(--text-tertiary)', marginTop: '6px' }}>{l}</div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </section>

                    {/* Active directors */}
                    <section style={{ padding: '0 32px 24px', maxWidth: '1400px', margin: '0 auto' }}>
                        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(min(320px, 100%), 1fr))', gap: '20px' }}>
                            {active.map(d => <Card key={d.id} d={d} />)}
                        </div>
                    </section>

                    {/* Upcoming */}
                    {upcoming.length > 0 && (
                        <section style={{ padding: '32px 32px 80px', maxWidth: '1400px', margin: '0 auto' }}>
                            <div style={{ display: 'flex', alignItems: 'center', gap: '16px', marginBottom: '20px' }}>
                                <span style={{ fontSize: '11px', letterSpacing: '.2em', textTransform: 'uppercase', color: 'var(--text-tertiary)' }}>
                                    Joining soon · {upcoming.length}
                                </span>
                                <div style={{ flex: 1, height: '1px', background: 'var(--border)' }} />
                            </div>
                            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(min(240px, 100%), 1fr))', gap: '16px' }}>
                                {upcoming.map(d => <Card key={d.id} d={d} />)}
                            </div>
                        </section>
                    )}
                </div>
            );
        };

        // ─── Director Profile ────────────────────────────────────────────
        const DirectorProfile = ({ director, onBack }) => {
            const d = useMemo(() => DIRECTOR_STATS.find(x => x.id === director.id) || { ...director, works: [], frames: 0, projects: 0, cover: null }, [director]);
            const hasVimeo = d.vimeo && !d.vimeo.includes('placeholder');

            const WorkCard = ({ work }) => {
                const [hover, setHover] = useState(false);
                const cover = work.frames[Math.min(1, work.frames.length - 1)];
                return (
                    <a
                        href={`../index.html?source=${encodeURIComponent(work.title)}`}
                        onMouseEnter={() => setHover(true)}
                        onMouseLeave={() => setHover(false)}
                        style={{
                            display: 'block', textDecoration: 'none', color: 'inherit',
                            borderRadius: '12px', overflow: 'hidden',
                            background: 'var(--bg-secondary)',
                            border: `1px solid ${hover ? 'var(--accent)' : 'var(--border)'}`,
                            transform: hover ? 'translateY(-3px)' : 'none',
                            transition: 'transform .3s cubic-bezier(.16,1,.3,1), border-color .25s'
                        }}
                    >
                        <div style={{ position: 'relative', aspectRatio: '16 / 9' }}>
                            <div style={{ position: 'absolute', inset: 0, transform: hover ? 'scale(1.04)' : 'scale(1)', transition: 'transform .7s cubic-bezier(.16,1,.3,1)' }}>
                                <Cover frame={cover} alt={work.title} style={{ position: 'absolute', inset: 0 }} />
                            </div>
                            <div style={{ position: 'absolute', inset: 0, background: 'linear-gradient(180deg, transparent 55%, rgba(0,0,0,.75) 100%)' }} />
                            <div style={{
                                position: 'absolute', bottom: '10px', right: '10px',
                                padding: '4px 9px', borderRadius: '6px', fontSize: '11px',
                                fontFamily: "'JetBrains Mono', monospace",
                                background: 'rgba(0,0,0,.7)', color: 'var(--accent)', backdropFilter: 'blur(6px)'
                            }}>
                                {work.frames.length} frames
                            </div>
                        </div>
                        <div style={{ padding: '14px 16px 16px', display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: '12px' }}>
                            <div style={{ fontSize: '14px', fontWeight: 600, color: 'var(--text-primary)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                                {work.title}
                            </div>
                            <span style={{ fontSize: '12px', color: hover ? 'var(--accent)' : 'var(--text-tertiary)', flexShrink: 0, transition: 'color .2s' }}>
                                Study →
                            </span>
                        </div>
                    </a>
                );
            };

            return (
                <div style={{ minHeight: '100vh' }}>
                    {/* Backdrop hero */}
                    <section style={{ position: 'relative', overflow: 'hidden', borderBottom: '1px solid var(--border)' }}>
                        {d.cover && (
                            <div style={{ position: 'absolute', inset: '-40px', filter: 'blur(28px) saturate(1.1)', opacity: .38, transform: 'scale(1.1)' }}>
                                <Cover frame={d.cover} alt="" style={{ position: 'absolute', inset: 0 }} />
                            </div>
                        )}
                        <div style={{ position: 'absolute', inset: 0, background: 'linear-gradient(180deg, rgba(10,10,10,.55) 0%, rgba(10,10,10,.85) 70%, var(--bg-primary) 100%)' }} />

                        <div style={{ position: 'relative', maxWidth: '1400px', margin: '0 auto', padding: '40px 32px 56px' }}>

                            <div style={{ display: 'grid', gridTemplateColumns: 'minmax(0, 1fr) auto', gap: '32px', alignItems: 'end' }} className="profile-hero-grid">
                                <div style={{ direction: 'rtl', textAlign: 'right' }}>
                                    <h1 style={{ fontFamily: "'HT Moshreq Pro', sans-serif", fontSize: 'clamp(44px, 6vw, 76px)', lineHeight: 1, color: '#fff', margin: 0, textShadow: '0 4px 30px rgba(0,0,0,.6)' }}>
                                        {d.nameAr}
                                    </h1>
                                    <div style={{ direction: 'ltr', textAlign: 'left' }}>
                                        <div style={{ fontSize: '22px', fontWeight: 300, color: 'var(--accent)', marginTop: '10px', letterSpacing: '-.01em' }}>{d.name}</div>
                                        {d.bio && (
                                            <p style={{ fontSize: '15px', lineHeight: 1.7, color: 'var(--text-secondary)', maxWidth: '640px', marginTop: '18px' }}>
                                                {d.bio}
                                            </p>
                                        )}
                                        <div style={{ display: 'flex', flexWrap: 'wrap', gap: '12px', marginTop: '26px' }}>
                                            {d.frames > 0 && (
                                                <a href={`../index.html?director=${encodeURIComponent(d.name)}`} style={{
                                                    display: 'inline-flex', alignItems: 'center', gap: '8px',
                                                    padding: '12px 22px', borderRadius: '8px',
                                                    background: 'var(--accent)', color: '#000', fontWeight: 600, fontSize: '14px', textDecoration: 'none'
                                                }}>
                                                    Browse all {d.frames.toLocaleString()} frames →
                                                </a>
                                            )}
                                            {hasVimeo && (
                                                <a href={d.vimeo} target="_blank" rel="noopener noreferrer" style={{
                                                    display: 'inline-flex', alignItems: 'center', gap: '8px',
                                                    padding: '12px 20px', borderRadius: '8px',
                                                    background: 'rgba(255,255,255,.06)', border: '1px solid var(--border)',
                                                    color: 'var(--text-primary)', fontSize: '14px', textDecoration: 'none'
                                                }}>
                                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M23.977 6.416c-.105 2.338-1.739 5.543-4.894 9.609-3.268 4.247-6.026 6.37-8.29 6.37-1.409 0-2.578-1.294-3.553-3.881L5.322 11.4C4.603 8.816 3.834 7.522 3.01 7.522c-.179 0-.806.378-1.881 1.132L0 7.197c1.185-1.044 2.351-2.084 3.501-3.128C5.08 2.701 6.266 1.984 7.055 1.91c1.867-.18 3.016 1.1 3.447 3.838.465 2.953.789 4.789.971 5.507.539 2.45 1.131 3.674 1.776 3.674.502 0 1.256-.796 2.265-2.385 1.004-1.589 1.54-2.797 1.612-3.628.144-1.371-.395-2.061-1.614-2.061-.574 0-1.167.121-1.777.391 1.186-3.868 3.434-5.757 6.762-5.637 2.473.06 3.628 1.664 3.493 4.797l-.013.01z"/></svg>
                                                    Vimeo
                                                </a>
                                            )}
                                        </div>
                                    </div>
                                </div>

                                {/* Stats block */}
                                <div style={{ display: 'flex', gap: '28px', padding: '18px 22px', borderRadius: '12px', background: 'rgba(0,0,0,.45)', border: '1px solid var(--border)', backdropFilter: 'blur(10px)' }}>
                                    {[[d.frames.toLocaleString(), 'Frames'], [d.projects, 'Projects']].map(([n, l]) => (
                                        <div key={l} style={{ textAlign: 'center' }}>
                                            <div style={{ fontSize: '30px', fontWeight: 700, color: 'var(--accent)', lineHeight: 1 }}>{n}</div>
                                            <div style={{ fontSize: '10px', letterSpacing: '.16em', textTransform: 'uppercase', color: 'var(--text-tertiary)', marginTop: '6px' }}>{l}</div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* Works */}
                    <section style={{ maxWidth: '1400px', margin: '0 auto', padding: '44px 32px 80px' }}>
                        <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', flexWrap: 'wrap', gap: '12px', marginBottom: '24px' }}>
                            <h2 style={{ margin: 0, display: 'flex', alignItems: 'baseline', gap: '14px' }}>
                                <span style={{ fontFamily: "'HT Moshreq Pro', sans-serif", fontSize: '30px', color: 'var(--accent)' }}>الأعمال</span>
                                <span style={{ fontSize: '14px', letterSpacing: '.16em', textTransform: 'uppercase', color: 'var(--text-tertiary)' }}>Works</span>
                            </h2>
                            {d.projects > 0 && <span style={{ fontSize: '13px', color: 'var(--text-tertiary)' }}>Click a project to study its frames</span>}
                        </div>

                        {d.works.length === 0 ? (
                            <div style={{ padding: '72px 24px', textAlign: 'center', border: '1px dashed var(--border)', borderRadius: '14px' }}>
                                <div style={{ fontSize: '40px', opacity: .25, marginBottom: '12px' }}>◇</div>
                                <div style={{ color: 'var(--text-secondary)', fontSize: '15px' }}>Frames from {d.name} are being prepared.</div>
                                <div style={{ color: 'var(--text-tertiary)', fontSize: '13px', marginTop: '6px' }}>Check back soon.</div>
                            </div>
                        ) : (
                            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(min(300px, 100%), 1fr))', gap: '18px' }}>
                                {d.works.map(w => <WorkCard key={w.title} work={w} />)}
                            </div>
                        )}
                    </section>
                </div>
            );
        };

        // Main App
        const App = () => {
            // Read the hash during the initial state so arriving at #director-id renders
            // the profile immediately, instead of flashing the full list for one frame.
            const [selectedDirector, setSelectedDirector] = useState(() => getDirectorFromHash() || null);

            useEffect(() => {
                // hashchange is the single source of truth (covers browser back/forward)
                const handleHashChange = () => {
                    setSelectedDirector(getDirectorFromHash() || null);
                };
                window.addEventListener('hashchange', handleHashChange);
                return () => window.removeEventListener('hashchange', handleHashChange);
            }, []);

            // Always land at the top when switching between list and profile
            useEffect(() => {
                window.scrollTo(0, 0);
            }, [selectedDirector]);

            const handleSelectDirector = (director) => {
                window.location.hash = director.id; // hashchange sets the state
            };

            const handleBack = () => {
                // replaceState avoids stacking empty "#" entries in history
                window.history.replaceState(null, '', window.location.pathname);
                setSelectedDirector(null);
            };

            return (
                <div>
                    <Header onBack={selectedDirector ? handleBack : null} />
                    {selectedDirector ? (
                        <DirectorProfile director={selectedDirector} onBack={handleBack} />
                    ) : (
                        <DirectorsList onSelectDirector={handleSelectDirector} />
                    )}
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
