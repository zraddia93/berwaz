        <form id="password-form" style="display:flex;flex-direction:column;align-items:center;gap:16px;">

            <button type="submit" style="background:#D4A853;color:#0a0a0a;border:none;padding:10px 32px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;font-family:'Space Grotesk',sans-serif;">Enter</button>
            <p id="password-error" style="color:#ff4444;font-size:13px;margin:0;display:none;">Incorrect password</p>
        </form>
    </div>

    <div id="root" style="display:none;"></div>

    <script>
        (function() {
            if (sessionStorage.getItem('berwaz_auth') === 'true') {
                document.getElementById('password-gate').style.display = 'none';
                document.getElementById('root').style.display = '';
            }
            document.getElementById('password-form').addEventListener('submit', function(e) {
                e.preventDefault();
                if (document.getElementById('password-input').value === 'berwaz93') {
                    sessionStorage.setItem('berwaz_auth', 'true');
                    document.getElementById('password-gate').style.display = 'none';
                    document.getElementById('root').style.display = '';
                } else {
                    document.getElementById('password-error').style.display = 'block';
                    document.getElementById('password-input').value = '';
                }
            });
        })();
    </script>

                                                    onMouseLeave={(e) => {
                                                        e.currentTarget.style.borderColor = 'var(--border)';
                                                        e.currentTarget.style.color = 'var(--text-secondary)';
                                                    }}
                                                >
                                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                                                        <path d="M23.977 6.416c-.105 2.338-1.739 5.543-4.894 9.609-3.268 4.247-6.026 6.37-8.29 6.37-1.409 0-2.578-1.294-3.553-3.881L5.322 11.4C4.603 8.816 3.834 7.522 3.01 7.522c-.179 0-.806.378-1.881 1.132L0 7.197c1.185-1.044 2.351-2.084 3.501-3.128C5.08 2.701 6.266 1.984 7.055 1.91c1.867-.18 3.016 1.1 3.447 3.838.465 2.953.789 4.789.971 5.507.539 2.45 1.131 3.674 1.776 3.674.502 0 1.256-.796 2.265-2.385 1.004-1.589 1.54-2.797 1.612-3.628.144-1.371-.395-2.061-1.614-2.061-.574 0-1.167.121-1.777.391 1.186-3.868 3.434-5.757 6.762-5.637 2.473.06 3.628 1.664 3.493 4.797l-.013.01z"/>
                                                    </svg>
                                                    Watch
                                                </a>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}

                        {/* View Frames Link */}
                        <div style={{ textAlign: 'center', marginTop: '48px' }}>
                            <a
                                href={`../index.html?director=${encodeURIComponent(director.name)}`}
                                style={{
                                    display: 'inline-flex',
                                    alignItems: 'center',
                                    gap: '8px',
                                    padding: '16px 32px',
                                    background: 'var(--accent)',
                                    color: '#000',
                                    borderRadius: '8px',
                                    textDecoration: 'none',
                                    fontSize: '16px',
                                    fontWeight: 600,
                                    transition: 'all 0.2s'
                                }}
                            >
                                View All Frames →
                            </a>
                        </div>
                    </div>
                </div>
            );
        };

        // Main App
        const App = () => {
            const [selectedDirector, setSelectedDirector] = useState(null);

            useEffect(() => {
                // Check URL hash on load
                const director = getDirectorFromHash();
                if (director) {
                    setSelectedDirector(director);
                }

                // Listen for hash changes
                const handleHashChange = () => {
                    const director = getDirectorFromHash();
                    setSelectedDirector(director || null);
                };

                window.addEventListener('hashchange', handleHashChange);
                return () => window.removeEventListener('hashchange', handleHashChange);
            }, []);

            const handleSelectDirector = (director) => {
                window.location.hash = director.id;
                setSelectedDirector(director);
            };

            const handleBack = () => {
                window.location.hash = '';
                setSelectedDirector(null);
            };

            return (
                <div>
                    <Header onBack={selectedDirector ? handleBack : null} />
                    {selectedDirector ? (
                        <DirectorProfile director={selectedDirector} onBack={handleBack} />
                    ) : (
                        <DirectorsList onSelectDirector={handleSelectDirector} />
                    )}
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
